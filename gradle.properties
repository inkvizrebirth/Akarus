# Память, выделяемая Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA пока не полностью совместима с configuration cache,
# подробности: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Версии инструментов Fabric (актуально для Minecraft 26.2)
# Свежие версии смотреть здесь: https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Параметры мода
mod_version=0.8.0
maven_group=com.akarus
archives_base_name=akarus

# Зависимости
fabric_api_version=0.159.0+26.2
