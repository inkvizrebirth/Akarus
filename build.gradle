plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// При желании сюда добавляются репозитории сторонних модов.
	// Всё необходимое для Minecraft и Fabric Loom подключает сам.
}

loom {
	// Мод полностью клиентский, поэтому разделять source set'ы на main/client не нужно:
	// весь код лежит в src/main/java, а точка входа объявлена как "client" в fabric.mod.json

	// Миксины и «проблема refmap» в Loom 1.17 (Minecraft 26.2)
	// -------------------------------------------------------
	// Для 26.2 в FabricMC/intermediary нет маппингов (26.2.tiny отсутствует; последняя
	// публикация — 1.21.11), а runtime Minecraft 26.2 использует официальные имена Mojang.
	// Значит:
	//   * вариант «remap=false + method_XXXX» невозможен — intermediary-имён просто нет;
	//   * legacy annotation-processor для refmap в этом Loom удалён
	//     (useLegacyMixinAp=true падает с «Configuration with name 'mappingsFinal' not found»);
	//   * refmap в jar не нужен: миксины ссылаются на цели по именам Mojang, которые и есть
	//     имена рантайма.
	// Миксины объявлены в dreamcast.mixins.json (секция "mixins" в fabric.mod.json). CI-шаг
	// «Verify mixins are remapped inside the jar» проверяет, что классы миксинов и конфиг
	// действительно лежат в jar.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API (нужны модули key-mapping и rendering — HUD)
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Юнит-тесты чистой логики модулей (SlotMath/MotionMath/DrinkLogic) —
	// без Minecraft-классов, поэтому гоняются на любом CI-раннере как есть
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed", "skipped"
		exceptionFormat "short"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// Встроенные моды вшиваем как nested jar (jar-in-jar): список объявлен
	// в fabric.mod.json (секция "jars"), файлы кладёт CI из GitHub releases
	// (Sodium, Lithium, Mod Menu, ImmediatelyFast). Компилируемся
	// мы против них через рефлексию (EmbeddedMods/ViaIntegration), поэтому
	// отсутствие jar не ломает компиляцию — но CI требует полный набор.
	def declared = new groovy.json.JsonSlurper().parse(file("src/main/resources/fabric.mod.json")).jars
	def declaredNames = declared.collect { entry -> entry.file.substring(entry.file.lastIndexOf('/') + 1) } as Set
	fileTree("libs").matching { include "*.jar" }.files.findAll { nested -> declaredNames.contains(nested.name) }.each { nested ->
		from(nested) {
			into "META-INF/jars"
		}
		logger.lifecycle("{} вшивается в META-INF/jars ({})", nested.name, nested.length())
	}
	// Рассинхрон с fabric.mod.json недопустим: loader не найдёт объявленный jar
	declared.each { entry ->
		if (!file("libs/" + entry.file.substring(entry.file.lastIndexOf('/') + 1)).exists()) {
			logger.warn("fabric.mod.json объявляет {}, но libs/ его нет — релиз соберётся БЕЗ него", entry.file)
		}
	}
}

// Minecraft 26.2 собирается под Java 25. Если в системе стоит более старый JDK,
// сборка упадёт с «release version 25 not supported» — подскажем заранее.
if (JavaVersion.current() < JavaVersion.VERSION_25) {
	logger.warn("\nДля сборки нужен JDK 25, а сейчас используется {}. Скачать: https://adoptium.net/temurin/releases/?version=25\n",
			JavaVersion.current())
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// В проекте русские строки и комментарии — явно указываем кодировку
	it.options.encoding = 'UTF-8'
}

java {
	// Loom сам прикрепит sourcesJar к задаче remapSourcesJar и к сборке
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Сюда можно добавить репозиторий для публикации мода
	}
}
