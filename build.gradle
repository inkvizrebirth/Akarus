plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// При желании сюда добавляются репозитории сторонних модов.
	// Всё необходимое для Minecraft и Fabric Loom подключает сам.
}

loom {
	// Мод полностью клиентский, поэтому разделять source set'ы на main/client не нужно:
	// весь код лежит в src/main/java, а точка входа объявлена как "client" в fabric.mod.json

	// Миксины и «проблема refmap» в Loom 1.17 (Minecraft 26.2)
	// -------------------------------------------------------
	// Для 26.2 в FabricMC/intermediary нет маппингов (26.2.tiny отсутствует; последняя
	// публикация — 1.21.11), а runtime Minecraft 26.2 использует официальные имена Mojang.
	// Значит:
	//   * вариант «remap=false + method_XXXX» невозможен — intermediary-имён просто нет;
	//   * legacy annotation-processor для refmap в этом Loom удалён
	//     (useLegacyMixinAp=true падает с «Configuration with name 'mappingsFinal' not found»);
	//   * refmap в jar не нужен: миксины ссылаются на цели по именам Mojang, которые и есть
	//     имена рантайма.
	// Миксины объявлены в akarus.mixins.json (секция "mixins" в fabric.mod.json). CI-шаг
	// «Verify mixins are remapped inside the jar» проверяет, что классы миксинов и конфиг
	// действительно лежат в jar.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API (нужны модули key-mapping и rendering — HUD)
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// ViaFabricPlus вшиваем как nested jar (jar-in-jar): Fabric Loader 0.19+ сам
	// подхватывает META-INF/jars. Локальная сборка без скачанного libs/ViaFabricPlus.jar
	// просто не получит папку — мод собирается и работает, только без виа внутри.
	// Компилируем мы против VFP через рефлексию (ViaIntegration), поэтому отсутствие
	// jar не ломает даже компиляцию.
	def nested = file("libs/ViaFabricPlus.jar")
	if (nested.exists()) {
		from(nested) {
			into "META-INF/jars"
		}
		logger.lifecycle("ViaFabricPlus вшивается в META-INF/jars ({})", nested.length())
	} else {
		logger.warn("libs/ViaFabricPlus.jar не найден — собираем без встроенного ViaFabricPlus")
	}
}

// Minecraft 26.2 собирается под Java 25. Если в системе стоит более старый JDK,
// сборка упадёт с «release version 25 not supported» — подскажем заранее.
if (JavaVersion.current() < JavaVersion.VERSION_25) {
	logger.warn("\nДля сборки нужен JDK 25, а сейчас используется {}. Скачать: https://adoptium.net/temurin/releases/?version=25\n",
			JavaVersion.current())
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// В проекте русские строки и комментарии — явно указываем кодировку
	it.options.encoding = 'UTF-8'
}

java {
	// Loom сам прикрепит sourcesJar к задаче remapSourcesJar и к сборке
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Сюда можно добавить репозиторий для публикации мода
	}
}
