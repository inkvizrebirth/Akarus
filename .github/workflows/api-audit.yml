name: api-audit

# Аудит имён Minecraft 26.2: локально нет доступа к maven'ам и артефактам,
# поэтому реальные сигнатуры снимает CI (javap по deobf-jar) и коммитит результат
# файлом в ветку запуска.
on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths: ['.github/workflows/api-audit.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Resolve Minecraft
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava --stacktrace > build.log 2>&1 || true
          tail -15 build.log

      - name: Inspect API
        run: |
          MC=$(find ~/.gradle/caches/fabric-loom -name '*deobf*.jar' 2>/dev/null | head -1)
          [ -z "$MC" ] && MC=$(find ~/.gradle/caches/fabric-loom -name 'minecraft*.jar' 2>/dev/null | grep -v sources | head -1)
          {
            echo "=== Screen (все public/protected) ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.Screen 2>&1 | grep -E 'public|protected'
            echo; echo "=== AbstractContainerEventHandler / GuiEventListener ==="
            javap -p -cp "$MC" net.minecraft.client.gui.components.events.GuiEventListener 2>&1
            javap -p -cp "$MC" net.minecraft.client.gui.components.events.AbstractContainerEventHandler 2>&1 | grep -E 'public'
            echo; echo "=== GuiManager ==="
            javap -p -cp "$MC" net.minecraft.client.GuiManager 2>&1 | head -40
            echo; echo "=== Minecraft поля/методы ==="
            javap -p -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -E 'public' | grep -iE 'screen|gui|level|player|options|gameMode|sound|texture|window|font|connection|version|brand|isRunning|stop\(|language|getSingleplayerServer|hitResult|interaction|user|profile' | head -40
            echo; echo "=== screens классы ==="
            unzip -l "$MC" | grep -oE 'net/minecraft/client/gui/screens(/[a-z]+)?/[A-Za-z]+\.class' | sort -u | grep -iE 'ultiplayer|erver|elect|ook|ause|itle|ptions|onnect|eneric|elected' | head -30
            echo; echo "=== JoinMultiplayerScreen ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.multiplayer.JoinMultiplayerScreen 2>&1 | grep -E 'public|protected' | head -30
            echo; echo "=== GameMenuScreen ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.GameMenuScreen 2>&1 | grep -E 'public|protected' | head -20
            echo; echo "=== Options public ==="
            javap -p -cp "$MC" net.minecraft.client.Options 2>&1 | grep -E 'public' | head -160
            echo; echo "=== OptionInstance public ==="
            javap -p -cp "$MC" net.minecraft.client.OptionInstance 2>&1 | grep -E 'public' | head -24
            echo; echo "=== GuiGraphicsExtractor public ==="
            javap -cp "$MC" net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | grep -E 'public' | head -140
            echo; echo "=== blit аргументы (имена параметров) ==="
            javap -v -cp "$MC" net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | grep -B2 -A14 'blit(' | head -100
            echo; echo "=== RenderPipelines GUI ==="
            javap -p -cp "$MC" net.minecraft.client.renderer.RenderPipelines 2>&1 | grep -iE 'public static final' | head -30
            echo; echo "=== MultiPlayerGameMode public ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -E 'public' | head -40
            echo; echo "=== ContainerInput ==="
            javap -p -cp "$MC" net.minecraft.world.inventory.ContainerInput 2>&1
            echo; echo "=== AbstractContainerMenu / InventoryMenu ==="
            javap -p -cp "$MC" net.minecraft.world.inventory.AbstractContainerMenu 2>&1 | grep -E 'public|protected' | grep -iE 'click|broadcast|getSlot|slots|containerId|remote' | head -14
            javap -p -cp "$MC" net.minecraft.world.inventory.InventoryMenu 2>&1 | head -16
            echo; echo "=== Inventory public ==="
            javap -cp "$MC" net.minecraft.world.entity.player.Inventory 2>&1 | grep -E 'public' | head -60
            echo; echo "=== Player public ==="
            javap -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -E 'public' | head -80
            echo; echo "=== LivingEntity public (hp/item/swing) ==="
            javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -E 'public|protected' | grep -iE 'Health|swing|Blocking|Using|fall|hurt|jump|Effect|Item|absor|attack|equip' | head -60
            echo; echo "=== Entity public (движение) ==="
            javap -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -E 'public' | grep -iE 'delta|position|ViewVector|LookAngle|Eye|Rot|distance|Ground|fire|getId|UUID|getType|tick|level|removed|age' | head -40
            echo; echo "=== Projectile / AbstractArrow ==="
            javap -cp "$MC" net.minecraft.world.entity.projectile.Projectile 2>&1 | grep -E 'public' | head -14
            javap -cp "$MC" net.minecraft.world.entity.projectile.AbstractArrow 2>&1 | grep -E 'public' | grep -iE 'pickup|shooter|Owner|crit|inGround|life' | head -8
            echo; echo "=== Items ==="
            javap -p -cp "$MC" net.minecraft.world.item.Items 2>&1 | grep -iE 'TOTEM|APPLE|SHIELD|SWORD|AXE|MACE|TRIDENT|BUCKET|BREAD|PEARL|BOW;|CROSSBOW|HEAVY_CORE|SNOWBALL' | head -40
            echo; echo "=== ItemStack public ==="
            javap -cp "$MC" net.minecraft.world.item.ItemStack 2>&1 | grep -E 'public' | head -46
            echo; echo "=== Util / OperatingSystem ==="
            javap -cp "$MC" net.minecraft.util.Util 2>&1 | grep -E 'public' | head -16
            javap -cp "$MC" net.minecraft.util.OperatingSystem 2>&1 | grep -E 'public' | head -16
            echo; echo "=== Gui / Hud ==="
            javap -p -cp "$MC" net.minecraft.client.gui.Gui 2>&1 | grep -E 'public' | head -26
            javap -p -cp "$MC" net.minecraft.client.gui.Hud 2>&1 | grep -E 'public' | head -40
            echo; echo "=== SoundManager / SimpleSoundInstance / SoundEvents ==="
            javap -p -cp "$MC" net.minecraft.client.sounds.SoundManager 2>&1 | grep -E 'public' | head -18
            javap -p -cp "$MC" net.minecraft.client.resources.sounds.SimpleSoundInstance 2>&1 | grep -E 'public' | head -12
            javap -p -cp "$MC" net.minecraft.sounds.SoundEvents 2>&1 | grep -iE 'UI_BUTTON|TOTEM|DISPENSER_FAIL|ANVIL|ENDERMAN|CHORUS|NOTE_BLOCK_HARP|FIREWORK' | head -10
            echo; echo "=== DeltaTracker / Input / PlayerInfo ==="
            javap -cp "$MC" net.minecraft.client.DeltaTracker 2>&1 | grep -E 'public' | head -10
            javap -cp "$MC" net.minecraft.world.entity.player.Input 2>&1 | grep -E 'public' | head -14
            javap -cp "$MC" net.minecraft.client.multiplayer.PlayerInfo 2>&1 | grep -iE 'latency' | head -4
            echo; echo "=== MobEffects / Mob / MobCategory / EquipmentSlot ==="
            javap -p -cp "$MC" net.minecraft.world.effect.MobEffects 2>&1 | grep -iE 'STRENGTH|SPEED|RESISTANCE|REGEN|INVISIBILITY' | head -8
            javap -cp "$MC" net.minecraft.world.entity.Mob 2>&1 | grep -iE 'Target' | head -6
            javap -p -cp "$MC" net.minecraft.world.entity.EquipmentSlot 2>&1 | grep -E 'public' | head -14
            echo; echo "=== EquipmentUser getItemBySlot ==="
            javap -p -cp "$MC" net.minecraft.world.entity.EquipmentUser 2>&1 | head -14
            echo; echo "=== Attributes ==="
            javap -p -cp "$MC" net.minecraft.world.entity.ai.attributes.Attributes 2>&1 | grep -iE 'ATTACK_DAMAGE|ARMOR' | head -6
            javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'getAttribute' | head -6
            javap -p -cp "$MC" net.minecraft.world.entity.ai.attributes.AttributeInstance 2>&1 | grep -E 'public' | head -8
            echo; echo "=== SharedConstants ==="
            javap -p -cp "$MC" net.minecraft.SharedConstants 2>&1 | grep -iE 'public static' | head -20
            echo; echo "=== Button (ванильный виджет) ==="
            javap -p -cp "$MC" net.minecraft.client.gui.components.Button 2>&1 | grep -E 'public' | head -24
            echo; echo "=== Level getEntities ==="
            javap -p -cp "$MC" net.minecraft.world.level.Level 2>&1 | grep -iE 'getEntities' | head -8
            echo; echo "=== ClientLevel getEntitiesOfClass? ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientLevel 2>&1 | grep -iE 'entit' | head -12
            echo; echo "=== Component (для подсказок) ==="
            javap -p -cp "$MC" net.minecraft.network.chat.Component 2>&1 | grep -iE 'public static' | head -12
            echo; echo "=== LocalPlayer swap ==="
            javap -p -cp "$MC" net.minecraft.client.player.LocalPlayer 2>&1 | grep -iE 'swap|impulse|chat\(|sendChatMessage|swing' | head -12
            echo; echo "=== Identifier класс ==="
            javap -p -cp "$MC" net.minecraft.resources.Identifier 2>&1 | grep -iE 'public static|fromNamespace' | head -8
            echo; echo "=== OperatingSystem open ==="
            javap -v -cp "$MC" net.minecraft.util.OperatingSystem 2>&1 | grep -B1 -A8 'open(' | head -40
            echo; echo "=== PauseScreen ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.PauseScreen 2>&1 | head -30
            echo; echo "=== TitleScreen весь ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.TitleScreen 2>&1 | head -44
            echo; echo "=== worldselection/keybinds screens ==="
            unzip -l "$MC" | grep -oE 'net/minecraft/client/gui/screens/(worldselection|controls|options/controls)/[A-Za-z]+\.class' | sort -u | head -24
            echo; echo "=== Gui: ссылки TitleScreen/PauseScreen + setScreen ==="
            javap -c -p -cp "$MC" net.minecraft.client.gui.Gui 2>&1 | grep -iE 'TitleScreen|PauseScreen|setScreen|private net.*Screen' | head -24
            echo; echo "=== Minecraft: начальный экран ==="
            javap -c -p -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -iE 'TitleScreen|setScreenAndShow|buildInitialScreens' | head -12
            echo; echo "=== OptionInstance public ==="
            javap -p -cp "$MC" net.minecraft.client.OptionInstance 2>&1 | grep -E 'public' | head -26
            echo; echo "=== Items ключевые (тотем/щит/булава/трезубец) ==="
            javap -p -cp "$MC" net.minecraft.world.item.Items 2>&1 | grep -iE 'TOTEM|SHIELD|MACE|TRIDENT|CROSSBOW|ELYTRA|ENDER_PEARL|TIPPED' | head -10
            echo; echo "=== Entity getDeltaMovement/getViewVector/isAlive ==="
            javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -E 'public' | grep -iE 'getDeltaMovement|setDeltaMovement|getViewVector|isAlive|getEyePosition|getLookAngle|position\(|lastPos|getDeltaMovementClamped' | head -14
            echo; echo "=== LivingEntity getHealth/getMaxHealth/getAbsorption/isBlocking/stopUsingItem/getUseItemRemaining ==="
            javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -E 'public' | grep -iE 'getHealth|getMaxHealth|Absorption|isBlocking|stopUsingItem|isUsingItem|getUseItemRemaining|getMainHandItem|getOffhandItem|getItemBySlot' | head -16
            echo; echo "=== Player getOffhandItem/isBlocking/attackStrength/getCooldowns/getAbilities ==="
            javap -p -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -E 'public' | grep -iE 'offhand|Offhand|block|attackStrength|Cooldown|Abilit|getInventory|getFood|experience' | head -16
            echo; echo "=== SoundEvents NOTE/TOTEM/UI_BUTTON ==="
            javap -p -cp "$MC" net.minecraft.sounds.SoundEvents 2>&1 | grep -iE 'NOTE_BLOCK_BLOCK_HARP|NOTE_BLOCK_PLING|TOTEM|UI_BUTTON|ANVIL_LAND|FIREWORK_BLAST|ENDERMAN_TELEPORT' | head -10
            echo; echo "=== AbstractArrow getOwner/isVisible/shot ==="
            javap -p -cp "$MC" net.minecraft.world.entity.projectile.AbstractArrow 2>&1 | grep -E 'public' | head -18
            echo; echo "=== EntityType category ==="
            javap -p -cp "$MC" net.minecraft.world.entity.EntityType 2>&1 | grep -iE 'category' | head -6
            echo; echo "=== VFP-подобные: ServerList getServer/selected ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.ServerList 2>&1 | grep -E 'public' | head -14
            echo; echo "=== ServerData ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.ServerData 2>&1 | grep -E 'public' | grep -iE 'version|getIp|name' | head -8
            echo; echo "=== Minecraft#pauseGame & disconnect ==="
            javap -p -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -E 'public' | grep -iE 'pauseGame|setScreen|getSingleplayerServer|isLocalServer|stop\(' | head -8
            echo; echo "=== WorldVersion ==="
            javap -p -cp "$MC" net.minecraft.WorldVersion 2>&1 | head -12
            echo; echo "=== GameConfigHandler? ==="
            unzip -l "$MC" | grep -oE 'net/minecraft/client/[a-z]+/[A-Za-z]*Config[A-Za-z]*\.class' | sort -u | head -6
            echo; echo "=== KeyBindsScreen конструктор ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.options.controls.KeyBindsScreen 2>&1 | head -8
            echo; echo "=== V6 Items: класс и родителя ==="
            javap -p -cp "$MC" net.minecraft.world.item.Items 2>&1 | head -4
            echo; echo "--- счётчики ---"
            javap -p -cp "$MC" net.minecraft.world.item.Items 2>&1 | grep -cE 'static final'
            echo "--- SHIELD/TOTEM/MACE/TRIDENT/CROSSBOW/APPLE ---"
            javap -p -cp "$MC" net.minecraft.world.item.Items 2>&1 | grep -E 'SHIELD|TOTEM|MACE|TRIDENT|CROSSBOW|APPLE;'
            echo "--- классы item/*.java (где ещё лежат константы) ---"
            unzip -l "$MC" | grep -oE 'net/minecraft/world/item/[A-Za-z]+\.class' | sort -u | grep -viE 'Item|Stack|Tier|Type|Group|Like|Base|Behavior|Category|Holder|Data|Display|Recipe|Sword|Axe|Tool|Armor|Bow|Shield|Bucket|Egg|Potion|Chorus|Dye|Trident|Fishing|Mace|Hoe|Pickaxe|Shovel|Shears|Flint|Skup|Spot' | head -30
            echo; echo "=== V6 Entity position/velocity ==="
            javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -E 'getDeltaMovement|setDeltaMovement|Vec3 position\(\)|double getX\(\)|double getY\(\)|double getZ\(\)|getYRot|getXRot|setYRot|setXRot|float getViewVector'
            echo; echo "=== V6 projectile классы ==="
            unzip -l "$MC" | grep -oE 'net/minecraft/world/entity/projectile/[A-Za-z]+\.class' | sort -u | grep -iE 'Arrow|Trident|Throwable|WindCharge|Abstract|Projectile|Exp' | head -20
            echo; echo "=== V6 SelectWorldScreen ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.worldselection.SelectWorldScreen 2>&1 | head -8
            echo; echo "=== V6 top options screens ==="
            unzip -l "$MC" | grep -oE 'net/minecraft/client/gui/screens/[a-zA-Z/]*Options[A-Za-z]*\.class' | sort -u | head -16
            echo; echo "=== V6 Options keySwapOffhand ==="
            javap -p -cp "$MC" net.minecraft.client.Options 2>&1 | grep -iE 'keySwap|keyUse|keyAttack|keySpectator|fullscreen\(\)|fov\(\)|gamma\(\)|guiScale\(\)|hideGUI'
            echo; echo "=== V6 Item getDescriptionId ==="
            javap -cp "$MC" net.minecraft.world.item.Item 2>&1 | grep -iE 'getDescriptionId|getDescription'
            echo; echo "=== V6 AbstractContainerMenu clickMenuButton ==="
            javap -p -cp "$MC" net.minecraft.world.inventory.AbstractContainerMenu 2>&1 | grep -iE 'clickMenuButton|SLOT_OFFHAND'
            javap -p -cp "$MC" net.minecraft.world.inventory.InventoryMenu 2>&1 | grep -iE 'clickMenuButton|OFFHAND|swap'
            echo; echo "=== V6 Inventory SLOT_OFFHAND значение + ItemEntity ==="
            javap -constants -cp "$MC" net.minecraft.world.entity.player.Inventory 2>&1 | grep -E 'SLOT_OFFHAND|NOT_FOUND'
            echo; echo "=== V6 Identifier с конструктором path ==="
            javap -p -cp "$MC" net.minecraft.resources.Identifier 2>&1 | grep -E 'public' | head -12
          } > api-audit2-result.txt 2>&1
          wc -l api-audit2-result.txt

      - name: Push results
        run: |
          git config user.name "arena-ai-coding-agent"
          git config user.email "arena-ai-coding-agent@users.noreply.github.com"
          git add -f api-audit2-result.txt
          git commit -m "ci: аудит API 26.2 (v4, полный дамп)"
          for i in 1 2 3; do
            git fetch -q origin "${{ github.ref_name }}" && \
            git rebase -q "origin/${{ github.ref_name }}" 2>/dev/null;
            if git push -q origin "HEAD:refs/heads/${{ github.ref_name }}"; then break; fi
            sleep 5
          done
          echo "::notice::audit lines=$(wc -l < api-audit2-result.txt)"
