name: api-audit

# Аудит имён Minecraft 26.2: локально нет доступа к maven'ам,
# поэтому сверяем реальные сигнатуры прямо на CI и коммитим результат в файл.
on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths: ['.github/workflows/api-audit.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Resolve Minecraft
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava --stacktrace > build.log 2>&1 || true
          tail -15 build.log

      - name: Inspect API
        run: |
          MC=$(find ~/.gradle/caches/fabric-loom -name '*deobf*.jar' 2>/dev/null | head -1)
          echo "MC_JAR=$MC"
          {
            echo "=== Screen (весь) ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.Screen 2>&1
            echo; echo "=== TitleScreen ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.TitleScreen 2>&1 | head -40
            echo; echo "=== GuiGraphicsExtractor (публичное) ==="
            javap -cp "$MC" net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | head -200
            echo; echo "=== Button / AbstractWidget ==="
            javap -p -cp "$MC" net.minecraft.client.gui.components.Button 2>&1 | head -40
            javap -p -cp "$MC" net.minecraft.client.gui.components.AbstractWidget 2>&1 | head -70
            echo; echo "=== Options (весь) ==="
            javap -p -cp "$MC" net.minecraft.client.Options 2>&1 | head -400
            echo; echo "=== PauseScreen / GameMenuScreen / Options screen ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.PauseScreen 2>&1 | head -30 || true
            javap -p -cp "$MC" net.minecraft.client.gui.screens.GameMenuScreen 2>&1 | head -40 || true
            javap -p -cp "$MC" net.minecraft.client.gui.screens.Options 2>&1 | head -25
            echo; echo "=== Экраны выбора серверов ==="
            unzip -l "$MC" | grep -iE 'serverselection|SelectServer|JoinMultiplayer|LanServer|ServerList|Address' | grep -v '\$' | head -20
            echo; echo "=== Minecraft (методы GUI/версии) ==="
            javap -p -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -iE 'screen|title|pause|stop|SoundManager|Language|version|brand|resize|user|scheduleTick' | head -30
            echo; echo "=== SharedConstants ==="
            javap -p -cp "$MC" net.minecraft.SharedConstants 2>&1 | grep -iE 'version|protocol|release' | head -20
            echo; echo "=== MultiPlayerGameMode (весь) ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | head -90
            echo; echo "=== ContainerInput (константы) ==="
            javap -p -cp "$MC" net.minecraft.world.inventory.ContainerInput 2>&1
            echo; echo "=== AbstractContainerMenu + InventoryMenu ==="
            javap -p -cp "$MC" net.minecraft.world.inventory.AbstractContainerMenu 2>&1 | grep -iE 'clickMenuButton|broadcastCarriedItems|getSlot|slots|containerId' | head -12
            javap -p -cp "$MC" net.minecraft.world.inventory.InventoryMenu 2>&1 | head -20
            echo; echo "=== Inventory (весь публичный) ==="
            javap -cp "$MC" net.minecraft.world.entity.player.Inventory 2>&1 | head -80
            echo; echo "=== Player (руки/еда/здоровье) ==="
            javap -p -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'hand|Using|inventor|swap|Health|Ability|experience|eat|getFood|block' | head -50
            echo; echo "=== LivingEntity (hp/свинг/падение/эффекты) ==="
            javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'Health|swing|blocking|Using|fall|hurt|jump|Effect|equipment|weapon|absorption|shield|attack' | head -70
            echo; echo "=== Entity (движение/позиция/поворот) ==="
            javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'DeltaMovement|position|YRot|XRot|onGround|fire|getId|getUUID|getViewVector|distanceTo|getType|tickCount|age|isRemoved|setRot|lastCalcOrigin' | head -50
            echo; echo "=== Projectile/AbstractArrow/Trident/Mace ==="
            unzip -l "$MC" | grep -iE 'projectile/.*(Arrow|Trident|Throwable|Projectile|WindCharge)[^/]*\.class' | head -12
            javap -p -cp "$MC" net.minecraft.world.entity.projectile.Projectile 2>&1 | grep -iE 'getOwner|shooter|position' | head -8
            javap -p -cp "$MC" net.minecraft.world.entity.projectile.AbstractArrow 2>&1 | grep -iE 'pickup|shooter|critical|inGround|life|isVisible' | head -10
            echo; echo "=== Items (ключевые константы) ==="
            javap -p -cp "$MC" net.minecraft.world.item.Items 2>&1 | grep -iE 'TOTEM|APPLE|SHIELD|SWORD|MACE|TRIDENT|BUCKET|BREAD|PEARL|BOW|CROSSBOW|HELMET' | head -30
            echo; echo "=== ItemStack ==="
            javap -cp "$MC" net.minecraft.world.item.ItemStack 2>&1 | grep -iE 'isEmpty|getItem|getCount|is\(|copy|save|deserialize' | head -12
            echo; echo "=== Item (use) + Consumable ==="
            javap -p -cp "$MC" net.minecraft.world.item.Item 2>&1 | grep -iE 'use|finishUsing|getUseDuration|eat|applyConsumptionEffects' | head -12
            javap -p -cp "$MC" net.minecraft.world.item.component.Consumable 2>&1 | grep -iE 'public' | head -12
            echo; echo "=== ClientLevel (сущности) ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientLevel 2>&1 | grep -iE 'entit|getEntity|players' | head -20
            echo; echo "=== AABB ==="
            javap -cp "$MC" net.minecraft.world.phys.AABB 2>&1 | grep -iE 'public' | head -40
            echo; echo "=== Util / OperatingSystem ==="
            javap -p -cp "$MC" net.minecraft.util.Util 2>&1 | head -25
            javap -p -cp "$MC" net.minecraft.util.OperatingSystem 2>&1 | head -25
            echo; echo "=== SoundManager / SimpleSoundInstance / SoundEvent ==="
            javap -p -cp "$MC" net.minecraft.client.sounds.SoundManager 2>&1 | head -25
            javap -p -cp "$MC" net.minecraft.client.resources.sounds.SimpleSoundInstance 2>&1 | head -20
            javap -p -cp "$MC" net.minecraft.sounds.SoundEvents 2>&1 | grep -iE 'UI_BUTTON|NOTE|BLOCK_NOTE|PLAY_DISC|STOP|RECORD' | head -10
            echo; echo "=== Hud/Gui: публичные поля ==="
            javap -p -cp "$MC" net.minecraft.client.gui.Gui 2>&1 | grep -iE 'public|hud' | head -30
            echo; echo "=== RenderPipelines (GUI-пайплайны) ==="
            javap -p -cp "$MC" net.minecraft.client.renderer.RenderPipelines 2>&1 | grep -iE 'GUI|TEXT' | head -20
            echo; echo "=== MobEffects / Mob / Enemy ==="
            javap -p -cp "$MC" net.minecraft.world.effect.MobEffects 2>&1 | grep -iE 'STRENGTH|SPEED|REGEN|RESISTANCE|POISON|WITHER' | head -8
            javap -p -cp "$MC" net.minecraft.world.entity.Mob 2>&1 | grep -iE 'getTarget|setTarget' | head -6
            echo; echo "=== EquipmentSlot ==="
            javap -p -cp "$MC" net.minecraft.world.entity.EquipmentSlot 2>&1 | grep -iE 'OFFHAND|MAINHAND|byName|public static' | head -12
            echo; echo "=== Attributes (урон оружия) ==="
            javap -p -cp "$MC" net.minecraft.world.entity.ai.attributes.Attributes 2>&1 | grep -iE 'ATTACK_DAMAGE|ARMOR|MOVEMENT_SPEED|KNOCKBACK' | head -8
            javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'getAttribute|getAttackDamage' | head -8
            echo; echo "=== KeyMapping (Category) ==="
            javap -p -cp "$MC" net.minecraft.client.KeyMapping 2>&1 | grep -iE 'public|Category' | head -30
            echo; echo "=== ClientLevel getEntitiesOfClass? ==="
            javap -p -cp "$MC" net.minecraft.world.level.Level 2>&1 | grep -iE 'getEntities|getEntity' | head -10
            echo; echo "=== TagKey / EntityType ==="
            javap -p -cp "$MC" net.minecraft.world.entity.EntityType 2>&1 | grep -iE 'category|getDefaultCategory|getCategory' | head -6
            echo; echo "=== MobCategory ==="
            javap -p -cp "$MC" net.minecraft.world.entity.MobCategory 2>&1 | grep -iE 'public' | head -15
            echo; echo "=== Sprite/GuiGraphics текстуры ==="
            javap -cp "$MC" net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | grep -iE 'texture|blit|submit|extract|color4|flush' | head -60
            echo; echo "=== TextureAtlasSprite / SpriteContents? ==="
            unzip -l "$MC" | grep -iE 'client/renderer/textures/(TextureAtlasSprite|SpriteContents|AbstractTexture)\.class' | head -5
            javap -p -cp "$MC" net.minecraft.client.renderer.textures.AbstractTexture 2>&1 | grep -iE 'load|upload|apply' | head -8
            echo; echo "=== DynamicTexture ==="
            unzip -l "$MC" | grep -iE 'DynamicTexture' | head -4
            javap -p -cp "$MC" net.minecraft.client.renderer.texture.DynamicTexture 2>&1 | head -25
            echo; echo "=== NativeImage ==="
            javap -p -cp "$MC" net.minecraft.client.renderer.texture.NativeImage 2>&1 | grep -iE 'read|getPixels|getHeight|getWidth|writeToFile|setPixel' | head -15
            echo; echo "=== Input ==="
            javap -p -cp "$MC" net.minecraft.world.entity.player.Input 2>&1 | head -20
            echo; echo "=== DeltaTracker ==="
            javap -p -cp "$MC" net.minecraft.client.DeltaTracker 2>&1 | grep -iE 'public' | head -12
            echo; echo "=== ClientPacketListener latency ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientPacketListener 2>&1 | grep -iE 'latency|getPlayerInfo|getConnection' | head -8
            echo; echo "=== GuiManager? screen access ==="
            unzip -l "$MC" | grep -oE 'net/minecraft/client/[A-Za-z]+\.class' | sort -u | head -50
          } > api-audit2-result.txt 2>&1
          wc -l api-audit2-result.txt

      - name: Push results
        if: always()
        run: |
          git config user.name "arena-ai-coding-agent"
          git config user.email "arena-ai-coding-agent@users.noreply.github.com"
          git add api-audit2-result.txt
          git commit -m "ci: аудит API 26.2 (GUI/AutoTotem/Via/медиа)" || exit 0
          git pull --rebase origin "$GITHUB_HEAD_REF" 2>/dev/null || git pull --rebase origin "${{ github.ref_name }}" 2>/dev/null || true
          git push origin "HEAD:refs/heads/${{ github.ref_name }}" || true
