name: api-audit

# Одноразовый аудит имён Minecraft 26.2: локально нет доступа к maven'ам,
# поэтому сверяем реальные сигнатуры прямо на CI и коммитим результат в файл.
on:
  workflow_dispatch:
  push:
    branches: [arena/01a066bd-akarus]
    paths: ['.github/workflows/api-audit.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Resolve Minecraft
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava --stacktrace > build.log 2>&1 || true
          tail -30 build.log

      - name: Inspect API
        run: |
          {
            echo "=== fabric-loom дерево каталогов ==="
            find ~/.gradle/caches/fabric-loom -maxdepth 4 -type d 2>/dev/null | head -60
            echo; echo "=== все jar в fabric-loom ==="
            find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null | head -60
            echo; echo "=== minecraft-*.jar по всему ~/.gradle ==="
            find ~/.gradle -name 'minecraft*.jar' 2>/dev/null | head -30

            MC=$(find ~/.gradle/caches/fabric-loom -name '*deobf*.jar' 2>/dev/null | head -1)
            if [ -z "$MC" ]; then
              for j in $(find ~/.gradle -name '*.jar' 2>/dev/null | grep -v sources); do
                if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Camera.class'; then MC="$j"; break; fi
              done
            fi
            echo; echo "MC_JAR=$MC"

            if [ -n "$MC" ]; then
              echo; echo "=== классы мобов/врагов/манекенов ==="
              unzip -l "$MC" | grep -iE 'entity/(Enemy|Monster|Mob|LivingEntity|player/Player)\.class|ArmorStand|MobCategory|EntityClassification'
              echo; echo "=== Entity ==="
              javap -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'setRot|setYRot|setXRot|getYRot|getXRot|getEyePosition|distanceTo|isInvisible|isSpectator|isAlive|getUUID|getType'
              echo; echo "=== LivingEntity ==="
              javap -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'hasLineOfSight|swing|isUsingItem|getHealth'
              echo; echo "=== Player ==="
              javap -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'getAttackStrengthScale|getHealth|getYRot|getXRot|setYRot|setXRot'
              echo; echo "=== ClientLevel ==="
              javap -cp "$MC" net.minecraft.client.multiplayer.ClientLevel 2>&1 | grep -iE 'entities'
              echo; echo "=== Level ==="
              javap -cp "$MC" net.minecraft.world.level.Level 2>&1 | grep -iE 'entities'
              echo; echo "=== Camera ==="
              javap -cp "$MC" net.minecraft.client.Camera 2>&1 | grep -iE 'setPosition|setRotation|isDetached|alignWithEntity|detached'
              echo; echo "=== MouseHandler ==="
              javap -cp "$MC" net.minecraft.client.MouseHandler 2>&1 | grep -iE 'turn|isRightPressed|xpos|ypos'
              echo; echo "=== MultiPlayerGameMode.attack ==="
              javap -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -iE 'attack'
              echo; echo "=== MultiPlayerGameMode (use/interact) ==="
              javap -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -iE 'use|interact'
              echo; echo "=== LivingEntity (block/using/move) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'stopUsingItem|isBlocking|onClimbable|isInWater|isInLava|zza|swing|fallDistance|isFallFlying|isPassenger|onGround|jumpFromGround|startUsingItem|getUseItem|isUsingItem'
              echo; echo "=== Player (hands/blocking) ==="
              javap -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'getOffhandItem|getMainhandItem|isBlocking|stopUsingItem|getItemInHand|getCooldowns'
              echo; echo "=== LocalPlayer (using) ==="
              javap -cp "$MC" net.minecraft.client.player.LocalPlayer 2>&1 | grep -iE 'stopUsingItem|isBlocking|startUsingItem|isUsingItem'
              echo; echo "=== Entity (ground/fall) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'fallDistance|zza|setSprinting|isSprinting|onGround|isPassenger'
              echo; echo "=== ItemStack ==="
              javap -cp "$MC" net.minecraft.world.item.ItemStack 2>&1 | grep -iE 'public boolean is\(|getItem'
              echo; echo "=== Items (shield) ==="
              javap -cp "$MC" net.minecraft.world.item.Items 2>&1 | grep -iE 'SHIELD'
              echo; echo "=== AABB ==="
              javap -cp "$MC" net.minecraft.world.phys.AABB 2>&1 | grep -iE 'minX|maxX|minY|maxY|minZ|maxZ|inflate'
              echo; echo "=== Options (keys) ==="
              javap -cp "$MC" net.minecraft.client.Options 2>&1 | grep -iE 'keySprint|keyJump|keyUp|keyShift|keyUse|keyAttack'
              echo; echo "=== Player (items/hands/slots, шире) ==="
              javap -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'item|hand|slot|inventor'
              echo; echo "=== LivingEntity (items/hands/slots) ==="
              javap -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'item|hand|slot|inventor'
              echo; echo "=== EquipmentUser ==="
              javap -cp "$MC" net.minecraft.world.entity.EquipmentUser 2>&1 || echo "нет класса EquipmentUser"
              echo; echo "=== EquipmentSlot ==="
              javap -cp "$MC" net.minecraft.world.entity.EquipmentSlot 2>&1 | grep -iE 'MAINHAND|OFFHAND|static'
              echo; echo "=== Inventory ==="
              javap -cp "$MC" net.minecraft.world.entity.player.Inventory 2>&1 | grep -iE 'getItem|offhand|held|selected' | head -20
              echo; echo "=== ItemCooldowns ==="
              javap -cp "$MC" net.minecraft.world.item.ItemCooldowns 2>&1 | grep -iE 'cooldown'
              echo; echo "=== Entity (water/lava) ==="
              javap -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'isInWater|isInLava|isInWaterRainOrBubble'
              echo; echo "=== GameRenderer (fov/nausea/fog/bob) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -iE 'fov|nausea|fog|bob|panorama|posteffect|depthof' || true
              echo; echo "=== Player/LivingEntity (fov modifier) ==="
              javap -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'fov|FieldOfView' || true
              javap -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'fov|FieldOfView' || true
              javap -p -cp "$MC" net.minecraft.client.player.AbstractClientPlayer 2>&1 | grep -iE 'fov|FieldOfView' || echo "нет AbstractClientPlayer по этому пути"
              echo; echo "=== Gui (оверлеи: огонь/тыква/портал) ==="
              javap -p -cp "$MC" net.minecraft.client.gui.Gui 2>&1 | grep -iE 'fire|pumpkin|portal|overlay|textureatlas|layer|freeze|vignette' | head -40 || true
              echo; echo "=== GuiRenderState (оверлеи) ==="
              javap -p -cp "$MC" net.minecraft.client.gui.GuiRenderState 2>&1 | grep -iE 'fire|pumpkin|portal|overlay|freeze|vignette' | head -30 || echo "нет GuiRenderState"
              echo; echo "=== LevelRenderer (fog) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.LevelRenderer 2>&1 | grep -iE 'fog' | head -15 || true
              echo; echo "=== BlockHitResult (конструкторы) ==="
              javap -cp "$MC" net.minecraft.world.phys.BlockHitResult 2>&1 | head -12 || true
              echo; echo "=== HitResult ==="
              javap -cp "$MC" net.minecraft.world.phys.HitResult 2>&1 | head -12 || true
              echo; echo "=== InventoryClick ==="
              javap -cp "$MC" net.minecraft.world.inventory.InventoryClick 2>&1 | head -25 || echo "нет InventoryClick"
              echo; echo "=== MultiPlayerGameMode (клики инвентаря) ==="
              javap -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -iE 'handleInventoryMouseClick|clickSlot|swap' || true
              echo; echo "=== вёдра ==="
              javap -cp "$MC" net.minecraft.world.item.Items 2>&1 | grep -iE 'BUCKET|WATER_BUCKET' || true
              javap -p -cp "$MC" net.minecraft.world.item.BucketItem 2>&1 | head -20 || echo "нет BucketItem"
              echo; echo "=== Blocks (water) ==="
              javap -cp "$MC" net.minecraft.world.level.block.Blocks 2>&1 | grep -iE 'WATER;' || true
              echo; echo "=== BlockState (water) ==="
              javap -cp "$MC" net.minecraft.world.level.material.FluidState 2>&1 | grep -iE 'isSource|getType' | head -8 || true
              javap -cp "$MC" net.minecraft.world.level.block.state.BlockState 2>&1 | grep -iE 'is\(|getFluidState' | head -6 || true
              echo; echo "=== MultiPlayerGameMode (полный) ==="
              javap -p -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -iE 'menu|slot|inventory|click|carried' | head -20 || true
              echo; echo "=== классы оверлеев ==="
              unzip -l "$MC" | grep -iE 'client/.*(overlay|layereddraw|guilayers)' | head -30 || true
              unzip -l "$MC" | grep -iE '(fireoverlay|pumpkin|portaloverlay|spyglassoverlay|powdersnowoverlay)' | head -15 || true
              echo; echo "=== FogRenderer ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.fog.FogRenderer 2>&1 | head -40 || true
              echo; echo "=== nausea-классы ==="
              unzip -l "$MC" | grep -i nausea | head -10 || true
              echo; echo "=== Camera (fov) ==="
              javap -p -cp "$MC" net.minecraft.client.Camera 2>&1 | grep -i fov | head -10 || true
              echo; echo "=== ClientPacketListener (carried) ==="
              javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientPacketListener 2>&1 | grep -iE 'carried|sendIsolated|openMenu' | head -10 || true
              echo; echo "=== LocalPlayer (connection) ==="
              javap -cp "$MC" net.minecraft.client.player.LocalPlayer 2>&1 | grep -iE 'connection' | head -5 || true
              echo; echo "=== MobEffects (nausea/darkness/blindness) ==="
              javap -cp "$MC" net.minecraft.core.registries.BuiltInRegistries 2>&1 | grep -i mobeffect | head -4 || true
              unzip -l "$MC" | grep -iE 'MobEffects.class|effects/MobEffects' | head -5 || true
              echo; echo "=== ContainerInput ==="
              javap -cp "$MC" net.minecraft.world.inventory.ContainerInput 2>&1 | head -30 || true
              echo; echo "=== MobEffects (константы) ==="
              javap -cp "$MC" net.minecraft.world.effect.MobEffects 2>&1 | grep -iE 'NAUSEA|DARKNESS|BLINDNESS' | head -8 || true
              echo; echo "=== fog environments ==="
              unzip -l "$MC" | grep -iE 'fog/environment' | head -20 || true
              echo; echo "=== gui layers/overlays ==="
              unzip -l "$MC" | grep -iE 'client/gui/(layers|hud)' | head -25 || true
              unzip -l "$MC" | grep -iE '(Vignette|SpyglassOverlay|PowderSnow|FireOverlay|GuiLayers|LayeredDraw)' | head -15 || true
              echo; echo "=== Identifier ==="
              javap -cp "$MC" net.minecraft.resources.Identifier 2>&1 | grep -iE 'getPath|getNamespace' | head -4 || true
              echo; echo "=== Inventory (поля) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.player.Inventory 2>&1 | grep -iE 'List|items|offhand' | head -12 || true
              echo; echo "=== LivingEntity (removeEffect) ==="
              javap -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'removeEffect|removeEffects' | head -6 || true
              echo; echo "=== Hud (fire/overlay) ==="
              javap -p -cp "$MC" net.minecraft.client.gui.Hud 2>&1 | grep -iE 'fire|overlay|portal|freeze|texture' | head -20 || true
              echo; echo "=== HudRenderState-подобные ==="
              unzip -l "$MC" | grep -iE 'client/gui/.*RenderState|renderstate/.*Hud' | head -10 || true
              echo; echo "=== EntityType ==="
              javap -cp "$MC" net.minecraft.world.entity.EntityType 2>&1 | grep -iE 'category|classification'
              echo; echo "=== MobCategory (константы) ==="
              javap -cp "$MC" net.minecraft.world.entity.MobCategory 2>&1 | head -30
              echo; echo "=== Camera приватные (alignWithEntity) ==="
              javap -p -cp "$MC" net.minecraft.client.Camera 2>&1 | grep -iE 'alignWithEntity|update\('
              echo; echo "=== MouseHandler приватные (turn) ==="
              javap -p -cp "$MC" net.minecraft.client.MouseHandler 2>&1 | grep -iE 'turn'
              echo; echo "=== Minecraft поля ==="
              javap -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -iE 'gameMode|mouseHandler|public net.minecraft.client.multiplayer.ClientLevel|public net.minecraft.client.player.LocalPlayer|gui;'
              echo; echo "=== Entity getView ==="
              javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'getViewYRot|getViewXRot|view'
              echo; echo "=== KeyMapping ==="
              javap -cp "$MC" net.minecraft.client.KeyMapping 2>&1 | grep -iE 'setKey|resetMapping|consumeClick|isDown|setDown'
            fi
          } > api-audit-result.txt 2>&1
          cat api-audit-result.txt

      - name: Commit result
        if: always()
        run: |
          git config user.name "arena-ai-coding-agent"
          git config user.email "arena-ai-coding-agent@users.noreply.github.com"
          git add api-audit-result.txt || true
          git commit -m "ci: результат аудита API 26.2" || exit 0
          git push

