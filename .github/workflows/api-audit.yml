name: Девятая проверка API (пост-эффекты, рендер)

on:
  push:
    branches: ["arena/01a0709d-dreamcast"]

permissions:
  contents: write

jobs:
  api-audit:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Разобрать кэш и достать классы
        run: |
          set +e
          mkdir -p out
          find .gradle-cache ~/.gradle/caches -name "*.jar" 2>/dev/null | while read -r j; do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/renderer/GameRenderer.class"; then echo "$j"; fi
          done > out/cands.txt
          FULL=$(head -1 out/cands.txt)
          echo "Полный jar: $FULL"
          unzip -o -q "$FULL" -d out/full
          COMMON=$(find .gradle-cache ~/.gradle/caches -name "*-client-common-*.jar" 2>/dev/null | head -1)
          if [ -n "$COMMON" ]; then unzip -o -q "$COMMON" -d out/common; fi
          echo "COMMON=$COMMON"
          { echo "FULL=$FULL"; echo "COMMON=$COMMON"; } >> "$GITHUB_ENV"
      - name: Аудит пост-эффектов и рендера
        run: |
          set +e
          exec > >(tee -a result.txt) 2>&1
          D=out/full
          echo "=== PostPass: байткод (биндинг входов) ==="
          javap -p -c -cp "$D" net.minecraft.client.renderer.PostPass 2>&1 | head -140
          echo "=== PostChainConfig\$Pass / TextureInput / TargetInput ==="
          javap -p -cp "$D" 'net.minecraft.client.renderer.PostChainConfig$Pass' 'net.minecraft.client.renderer.PostChainConfig$TextureInput' 'net.minecraft.client.renderer.PostChainConfig$TargetInput' 'net.minecraft.client.renderer.PostChainConfig$InternalTarget' 2>&1
          echo "=== blit.fsh ==="
          unzip -p "$FULL" assets/minecraft/shaders/post/blit.fsh 2>/dev/null || cat "$D/assets/minecraft/shaders/post/blit.fsh" 2>/dev/null
          echo "=== transparency.json (пример цепи с двумя таргетами) ==="
          cat "$D/assets/minecraft/post_effect/transparency.json" 2>/dev/null | head -60
          echo "=== кто вызывает checkEntityPostEffect ==="
          grep -rl "checkEntityPostEffect" "$D"/net/minecraft/client 2>/dev/null | head -5
          echo "=== Minecraft.render / LevelRenderEvents порядок ==="
          javap -p -cp "$D" net.minecraft.client.Minecraft 2>&1 | grep -E 'public void runTick|void render\(boolean|runGameLoop|renderLevel' | head -6
          echo "=== LevelRenderer: custom geometry ==="
          javap -p -cp "$D" net.minecraft.client.renderer.LevelRenderer 2>&1 | grep -iE 'submit|collector|CustomGeometry' | head -14
          echo "=== где лежит RenderTypes ==="
          find "$D"/net/minecraft/client/renderer -maxdepth 2 -name 'RenderTypes.class' -o -maxdepth 3 -name 'RenderTypes.class' | head -3
          for f in $(find "$D"/net/minecraft/client/renderer -name 'RenderTypes.class' | head -1); do javap -p -cp "$D" "$(echo "$f" | sed "s|$D/||; s|\.class$||; s|/|.|g")" 2>&1 | grep -iE 'emissive|depth|translucent|lines' | head -30; done
          echo "=== ScreenEffectRenderer public ==="
          javap -p -cp "$D" net.minecraft.client.renderer.ScreenEffectRenderer 2>&1
          echo "=== RenderPass: pass для пост-эффектов/depth ==="
          javap -p -cp "$D" net.minecraft.client.renderer.RenderPass 2>&1 | head -40
          echo "=== кто вызывает checkEntityPostEffect (константы классов) ==="
          for c in Minecraft GameRenderer LevelRenderer; do echo "-- $c"; javap -p -c -cp "$D" net.minecraft.client.renderer.$c 2>/dev/null | grep -B2 -A2 checkEntityPostEffect | head -20; javap -p -c -cp "$D" net.minecraft.client.$c 2>/dev/null | grep -B2 -A2 checkEntityPostEffect | head -20; done
          echo "=== PostPass: поля и конструктор ==="
          javap -p -cp "$D" net.minecraft.client.renderer.PostPass 2>&1
          echo "=== PostPass: байткод конструктора (сколько сэмплеров) ==="
          javap -p -c -cp "$D" net.minecraft.client.renderer.PostPass 2>&1 | sed -n '1,120p'
          echo "=== blit.fsh ==="
          cat "$D/assets/minecraft/shaders/post/blit.fsh" 2>/dev/null
          echo "=== screenquad.vsh ==="
          cat "$D/assets/minecraft/shaders/core/screenquad.vsh" 2>/dev/null
          echo "=== PostChain$TargetBundle ==="
          javap -p -cp "$D" 'net.minecraft.client.renderer.PostChain$TargetBundle' 2>&1
          echo "=== PostChain.load байткод (как резолвятся имена таргетов) ==="
          javap -p -c -cp "$D" net.minecraft.client.renderer.PostChain 2>&1 | sed -n '1,60p'
          exit 0
      - name: Закоммитить результат
        run: |
          set +e
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git pull --rebase -q || true
          if git rev-parse --verify -q origin/arena/01a0709d-dreamcast >/dev/null; then git merge -X ours -q origin/arena/01a0709d-dreamcast || true; fi
          echo "=== merged ==="
          javap -p -cp "$FULL" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -iE 'postEffect|MainTarget' >> result.txt
          git add -f api-audit-result.txt
          git commit -m "ci: результат аудита API 26.2" || true
          git push origin HEAD:refs/heads/arena/01a0709d-dreamcast || true
          exit 0
