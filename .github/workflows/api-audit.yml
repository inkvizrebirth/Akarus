name: api-audit

# Одноразовый аудит имён Minecraft 26.2: локально нет доступа к maven'ам,
# поэтому сверяем реальные сигнатуры прямо на CI. Запускается вручную.
on: workflow_dispatch

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Resolve Minecraft
        run: |
          chmod +x ./gradlew
          # Сборка упадёт на ошибках компиляции — нам нужен только скачанный jar
          ./gradlew compileJava --stacktrace > build.log 2>&1 || true
          echo "=== loom jars ==="
          find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null | grep -v sources | sort | head -40

      - name: Inspect API
        run: |
          MC=""
          for j in $(find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null | grep -v sources); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/entity/Entity.class'; then MC="$j"; break; fi
          done
          echo "MC_JAR=$MC"
          test -n "$MC"

          echo "=== классы про мобов/врагов ==="
          unzip -l "$MC" | grep -iE 'entity/(Enemy|Monster|Mob|LivingEntity)\.class|ArmorStand|MobCategory|EntityClassification|entity/decoration/'

          echo "=== net.minecraft.world.entity.Entity ==="
          javap -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'setRot|setYRot|setXRot|getYRot|getXRot|getEyePosition|distanceTo|isInvisible|isSpectator|isAlive|getUUID|getType|level\('

          echo "=== LivingEntity ==="
          javap -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'hasLineOfSight|swing|isUsingItem|getHealth'

          echo "=== Player ==="
          javap -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'getAttackStrengthScale|getHealth'

          echo "=== ClientLevel ==="
          javap -cp "$MC" net.minecraft.client.multiplayer.ClientLevel 2>&1 | grep -iE 'entitiesForRendering|getEntities|entitiesForListing'

          echo "=== Level ==="
          javap -cp "$MC" net.minecraft.world.level.Level 2>&1 | grep -iE 'entitiesForRendering|getEntities'

          echo "=== Camera ==="
          javap -cp "$MC" net.minecraft.client.Camera 2>&1 | grep -iE 'setPosition|setRotation|isDetached|alignWithEntity|detached'

          echo "=== MouseHandler ==="
          javap -cp "$MC" net.minecraft.client.MouseHandler 2>&1 | grep -iE 'turn|isRightPressed|xpos|ypos'

          echo "=== MultiPlayerGameMode.attack ==="
          javap -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -iE 'attack'

          echo "=== EntityType ==="
          javap -cp "$MC" net.minecraft.world.entity.EntityType 2>&1 | grep -iE 'category|classification'

          echo "=== KeyMapping ==="
          javap -cp "$MC" net.minecraft.client.KeyMapping 2>&1 | grep -iE 'setKey|resetMapping|consumeClick|isDown|setDown'
