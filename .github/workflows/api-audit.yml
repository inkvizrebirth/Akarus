name: api-audit

# Одноразовый аудит имён Minecraft 26.2: локально нет доступа к maven'ам,
# поэтому сверяем реальные сигнатуры прямо на CI и коммитим результат в файл.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['.github/workflows/api-audit.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Resolve Minecraft
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava --stacktrace > build.log 2>&1 || true
          tail -30 build.log

      - name: Inspect API
        run: |
          {
            echo "=== fabric-loom дерево каталогов ==="
            find ~/.gradle/caches/fabric-loom -maxdepth 4 -type d 2>/dev/null | head -60
            echo; echo "=== все jar в fabric-loom ==="
            find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null | head -60
            echo; echo "=== minecraft-*.jar по всему ~/.gradle ==="
            find ~/.gradle -name 'minecraft*.jar' 2>/dev/null | head -30

            MC=$(find ~/.gradle/caches/fabric-loom -name '*deobf*.jar' 2>/dev/null | head -1)
            if [ -z "$MC" ]; then
              for j in $(find ~/.gradle -name '*.jar' 2>/dev/null | grep -v sources); do
                if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Camera.class'; then MC="$j"; break; fi
              done
            fi
            echo; echo "MC_JAR=$MC"

            if [ -n "$MC" ]; then
              echo; echo "=== классы мобов/врагов/манекенов ==="
              unzip -l "$MC" | grep -iE 'entity/(Enemy|Monster|Mob|LivingEntity|player/Player)\.class|ArmorStand|MobCategory|EntityClassification'
              echo; echo "=== Entity ==="
              javap -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'setRot|setYRot|setXRot|getYRot|getXRot|getEyePosition|distanceTo|isInvisible|isSpectator|isAlive|getUUID|getType'
              echo; echo "=== LivingEntity ==="
              javap -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'hasLineOfSight|swing|isUsingItem|getHealth'
              echo; echo "=== Player ==="
              javap -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'getAttackStrengthScale|getHealth|getYRot|getXRot|setYRot|setXRot'
              echo; echo "=== ClientLevel ==="
              javap -cp "$MC" net.minecraft.client.multiplayer.ClientLevel 2>&1 | grep -iE 'entities'
              echo; echo "=== Level ==="
              javap -cp "$MC" net.minecraft.world.level.Level 2>&1 | grep -iE 'entities'
              echo; echo "=== Camera ==="
              javap -cp "$MC" net.minecraft.client.Camera 2>&1 | grep -iE 'setPosition|setRotation|isDetached|alignWithEntity|detached'
              echo; echo "=== MouseHandler ==="
              javap -cp "$MC" net.minecraft.client.MouseHandler 2>&1 | grep -iE 'turn|isRightPressed|xpos|ypos'
              echo; echo "=== MultiPlayerGameMode.attack ==="
              javap -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -iE 'attack'
              echo; echo "=== MultiPlayerGameMode (use/interact) ==="
              javap -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -iE 'use|interact'
              echo; echo "=== LivingEntity (block/using/move) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'stopUsingItem|isBlocking|onClimbable|isInWater|isInLava|zza|swing|fallDistance|isFallFlying|isPassenger|onGround|jumpFromGround|startUsingItem|getUseItem|isUsingItem'
              echo; echo "=== Player (hands/blocking) ==="
              javap -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'getOffhandItem|getMainhandItem|isBlocking|stopUsingItem|getItemInHand|getCooldowns'
              echo; echo "=== LocalPlayer (using) ==="
              javap -cp "$MC" net.minecraft.client.player.LocalPlayer 2>&1 | grep -iE 'stopUsingItem|isBlocking|startUsingItem|isUsingItem'
              echo; echo "=== Entity (ground/fall) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'fallDistance|zza|setSprinting|isSprinting|onGround|isPassenger'
              echo; echo "=== ItemStack ==="
              javap -cp "$MC" net.minecraft.world.item.ItemStack 2>&1 | grep -iE 'public boolean is\(|getItem'
              echo; echo "=== Items (shield) ==="
              javap -cp "$MC" net.minecraft.world.item.Items 2>&1 | grep -iE 'SHIELD'
              echo; echo "=== AABB ==="
              javap -cp "$MC" net.minecraft.world.phys.AABB 2>&1 | grep -iE 'minX|maxX|minY|maxY|minZ|maxZ|inflate'
              echo; echo "=== Options (keys) ==="
              javap -cp "$MC" net.minecraft.client.Options 2>&1 | grep -iE 'keySprint|keyJump|keyUp|keyShift|keyUse|keyAttack'
              echo; echo "=== Player (items/hands/slots, шире) ==="
              javap -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'item|hand|slot|inventor'
              echo; echo "=== LivingEntity (items/hands/slots) ==="
              javap -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'item|hand|slot|inventor'
              echo; echo "=== EquipmentUser ==="
              javap -cp "$MC" net.minecraft.world.entity.EquipmentUser 2>&1 || echo "нет класса EquipmentUser"
              echo; echo "=== EquipmentSlot ==="
              javap -cp "$MC" net.minecraft.world.entity.EquipmentSlot 2>&1 | grep -iE 'MAINHAND|OFFHAND|static'
              echo; echo "=== Inventory ==="
              javap -cp "$MC" net.minecraft.world.entity.player.Inventory 2>&1 | grep -iE 'getItem|offhand|held|selected' | head -20
              echo; echo "=== ItemCooldowns ==="
              javap -cp "$MC" net.minecraft.world.item.ItemCooldowns 2>&1 | grep -iE 'cooldown'
              echo; echo "=== Entity (water/lava) ==="
              javap -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'isInWater|isInLava|isInWaterRainOrBubble'
              echo; echo "=== GameRenderer (fov/nausea/fog/bob) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -iE 'fov|nausea|fog|bob|panorama|posteffect|depthof' || true
              echo; echo "=== Player/LivingEntity (fov modifier) ==="
              javap -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'fov|FieldOfView' || true
              javap -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'fov|FieldOfView' || true
              javap -p -cp "$MC" net.minecraft.client.player.AbstractClientPlayer 2>&1 | grep -iE 'fov|FieldOfView' || echo "нет AbstractClientPlayer по этому пути"
              echo; echo "=== Gui (оверлеи: огонь/тыква/портал) ==="
              javap -p -cp "$MC" net.minecraft.client.gui.Gui 2>&1 | grep -iE 'fire|pumpkin|portal|overlay|textureatlas|layer|freeze|vignette' | head -40 || true
              echo; echo "=== GuiRenderState (оверлеи) ==="
              javap -p -cp "$MC" net.minecraft.client.gui.GuiRenderState 2>&1 | grep -iE 'fire|pumpkin|portal|overlay|freeze|vignette' | head -30 || echo "нет GuiRenderState"
              echo; echo "=== LevelRenderer (fog) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.LevelRenderer 2>&1 | grep -iE 'fog' | head -15 || true
              echo; echo "=== BlockHitResult (конструкторы) ==="
              javap -cp "$MC" net.minecraft.world.phys.BlockHitResult 2>&1 | head -12 || true
              echo; echo "=== HitResult ==="
              javap -cp "$MC" net.minecraft.world.phys.HitResult 2>&1 | head -12 || true
              echo; echo "=== InventoryClick ==="
              javap -cp "$MC" net.minecraft.world.inventory.InventoryClick 2>&1 | head -25 || echo "нет InventoryClick"
              echo; echo "=== MultiPlayerGameMode (клики инвентаря) ==="
              javap -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -iE 'handleInventoryMouseClick|clickSlot|swap' || true
              echo; echo "=== вёдра ==="
              javap -cp "$MC" net.minecraft.world.item.Items 2>&1 | grep -iE 'BUCKET|WATER_BUCKET' || true
              javap -p -cp "$MC" net.minecraft.world.item.BucketItem 2>&1 | head -20 || echo "нет BucketItem"
              echo; echo "=== Blocks (water) ==="
              javap -cp "$MC" net.minecraft.world.level.block.Blocks 2>&1 | grep -iE 'WATER;' || true
              echo; echo "=== BlockState (water) ==="
              javap -cp "$MC" net.minecraft.world.level.material.FluidState 2>&1 | grep -iE 'isSource|getType' | head -8 || true
              javap -cp "$MC" net.minecraft.world.level.block.state.BlockState 2>&1 | grep -iE 'is\(|getFluidState' | head -6 || true
              echo; echo "=== MultiPlayerGameMode (полный) ==="
              javap -p -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -iE 'menu|slot|inventory|click|carried' | head -20 || true
              echo; echo "=== классы оверлеев ==="
              unzip -l "$MC" | grep -iE 'client/.*(overlay|layereddraw|guilayers)' | head -30 || true
              unzip -l "$MC" | grep -iE '(fireoverlay|pumpkin|portaloverlay|spyglassoverlay|powdersnowoverlay)' | head -15 || true
              echo; echo "=== FogRenderer ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.fog.FogRenderer 2>&1 | head -40 || true
              echo; echo "=== nausea-классы ==="
              unzip -l "$MC" | grep -i nausea | head -10 || true
              echo; echo "=== Camera (fov) ==="
              javap -p -cp "$MC" net.minecraft.client.Camera 2>&1 | grep -i fov | head -10 || true
              echo; echo "=== ClientPacketListener (carried) ==="
              javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientPacketListener 2>&1 | grep -iE 'carried|sendIsolated|openMenu' | head -10 || true
              echo; echo "=== LocalPlayer (connection) ==="
              javap -cp "$MC" net.minecraft.client.player.LocalPlayer 2>&1 | grep -iE 'connection' | head -5 || true
              echo; echo "=== MobEffects (nausea/darkness/blindness) ==="
              javap -cp "$MC" net.minecraft.core.registries.BuiltInRegistries 2>&1 | grep -i mobeffect | head -4 || true
              unzip -l "$MC" | grep -iE 'MobEffects.class|effects/MobEffects' | head -5 || true
              echo; echo "=== ContainerInput ==="
              javap -cp "$MC" net.minecraft.world.inventory.ContainerInput 2>&1 | head -30 || true
              echo; echo "=== MobEffects (константы) ==="
              javap -cp "$MC" net.minecraft.world.effect.MobEffects 2>&1 | grep -iE 'NAUSEA|DARKNESS|BLINDNESS' | head -8 || true
              echo; echo "=== fog environments ==="
              unzip -l "$MC" | grep -iE 'fog/environment' | head -20 || true
              echo; echo "=== gui layers/overlays ==="
              unzip -l "$MC" | grep -iE 'client/gui/(layers|hud)' | head -25 || true
              unzip -l "$MC" | grep -iE '(Vignette|SpyglassOverlay|PowderSnow|FireOverlay|GuiLayers|LayeredDraw)' | head -15 || true
              echo; echo "=== Identifier ==="
              javap -cp "$MC" net.minecraft.resources.Identifier 2>&1 | grep -iE 'getPath|getNamespace' | head -4 || true
              echo; echo "=== Inventory (поля) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.player.Inventory 2>&1 | grep -iE 'List|items|offhand' | head -12 || true
              echo; echo "=== LivingEntity (removeEffect) ==="
              javap -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'removeEffect|removeEffects' | head -6 || true
              echo; echo "=== Hud (fire/overlay) ==="
              javap -p -cp "$MC" net.minecraft.client.gui.Hud 2>&1 | grep -iE 'fire|overlay|portal|freeze|texture' | head -20 || true
              echo; echo "=== HudRenderState-подобные ==="
              unzip -l "$MC" | grep -iE 'client/gui/.*RenderState|renderstate/.*Hud' | head -10 || true
              echo; echo "=== EntityType ==="
              javap -cp "$MC" net.minecraft.world.entity.EntityType 2>&1 | grep -iE 'category|classification'
              echo; echo "=== MobCategory (константы) ==="
              javap -cp "$MC" net.minecraft.world.entity.MobCategory 2>&1 | head -30
              echo; echo "=== Camera приватные (alignWithEntity) ==="
              javap -p -cp "$MC" net.minecraft.client.Camera 2>&1 | grep -iE 'alignWithEntity|update\('
              echo; echo "=== MouseHandler приватные (turn) ==="
              javap -p -cp "$MC" net.minecraft.client.MouseHandler 2>&1 | grep -iE 'turn'
              echo; echo "=== Minecraft поля ==="
              javap -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -iE 'gameMode|mouseHandler|public net.minecraft.client.multiplayer.ClientLevel|public net.minecraft.client.player.LocalPlayer|gui;'
              echo; echo "=== Entity getView ==="
              javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'getViewYRot|getViewXRot|view'
              echo; echo "=== KeyMapping ==="
              javap -cp "$MC" net.minecraft.client.KeyMapping 2>&1 | grep -iE 'setKey|resetMapping|consumeClick|isDown|setDown'

              # --- ротации: единый RotationManager (аудит 2026-09-05) ---
              echo; echo "=== LocalPlayer (полный) ==="
              javap -p -cp "$MC" net.minecraft.client.player.LocalPlayer 2>&1 | head -80 || true
              echo; echo "=== LocalPlayer (send/rotation) ==="
              javap -p -cp "$MC" net.minecraft.client.player.LocalPlayer 2>&1 | grep -iE 'send|rot|yaw|pitch|head|body|jump|slow|sneak' || true
              echo; echo "=== Entity (поля поворота) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'yRot|xRot|yHeadRot|yBodyRot|deltaMovement|tickCount|getLook|getViewVector' || true
              echo; echo "=== LivingEntity (body/head rot) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'yBodyRot|yHeadRot|xRotO|headRot|bodyRot|attackStrength|tick' || true
              echo; echo "=== ServerboundMovePlayerPacket ==="
              javap -p -cp "$MC" net.minecraft.network.protocol.game.ServerboundMovePlayerPacket 2>&1 || true
              echo; echo "=== ServerboundMovePlayerPacket inner ==="
              unzip -l "$MC" | grep -E 'ServerboundMovePlayerPacket' || true
              for c in Rot Pos PosRot StatusOnly StatusRotOnly; do
                echo "--- \$$c ---"
                javap -p -cp "$MC" "net.minecraft.network.protocol.game.ServerboundMovePlayerPacket\$$c" 2>&1 | head -12 || true
              done
              echo; echo "=== ClientPacketListener (send) ==="
              javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientPacketListener 2>&1 | grep -iE 'public.*(send|tick)\(' | head -30 || true
              echo; echo "=== MultiPlayerGameMode (полный) ==="
              javap -p -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -iE 'public' | head -40 || true
              echo; echo "=== Minecraft (hitResult/camera) ==="
              javap -p -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -iE 'hitResult|camera|getCameraEntity|setScreen|tick|pause|levelRenderer|getUser' | head -30 || true
              echo; echo "=== Camera (полный) ==="
              javap -p -cp "$MC" net.minecraft.client.Camera 2>&1 || true
              echo; echo "=== Options (полный, кратко) ==="
              javap -p -cp "$MC" net.minecraft.client.Options 2>&1 | grep -iE 'key|sensitivity|fov|getSensitivity' | head -40 || true
              echo; echo "=== Hud (все методы overlay/fire) ==="
              javap -p -cp "$MC" net.minecraft.client.gui.Hud 2>&1 | grep -iE 'fire|camer|texture|vignette|extract' | head -30 || true
              echo; echo "=== PlayerRenderer / render state ==="
              unzip -l "$MC" | grep -iE 'renderer/entity/(state/)?(player|Player)' | head -20 || true
              echo; echo "=== AbstractClientPlayer ==="
              javap -p -cp "$MC" net.minecraft.client.player.AbstractClientPlayer 2>&1 | head -40 || true
              echo; echo "=== Player (attack/rotation) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'attack|swing|rot|item|container|sleep' | head -40 || true
              echo; echo "=== Input record ==="
              javap -p -cp "$MC" net.minecraft.world.entity.player.Input 2>&1 | head -30 || true
              echo; echo "=== ClientInput ==="
              javap -p -cp "$MC" net.minecraft.client.player.ClientInput 2>&1 | head -30 || true
              echo; echo "=== KeyboardInput ==="
              javap -p -cp "$MC" net.minecraft.client.player.KeyboardInput 2>&1 | head -20 || true
              echo; echo "=== EntityDimensions ==="
              javap -p -cp "$MC" net.minecraft.world.entity.EntityDimensions 2>&1 | head -20 || true
              echo; echo "=== Mob (isAggressive/target) ==="
              javap -cp "$MC" net.minecraft.world.entity.Mob 2>&1 | grep -iE 'aggress|target|leash|banne|sleep|invulnerable' | head -20 || true
              echo; echo "=== PathfinderMob? Mob 2 ==="
              javap -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'isBaby|getMaxHealth|getHealth|getAbsorb|hasEffect|getBlockSpeed|getAttribute|activeEffects' | head -20 || true
              echo; echo "=== Entity (name/team) ==="
              javap -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'getName|getDisplayName|getTeam|getTags|position|blockPosition|getBoundingBox|getBb|isRemoved|validat' | head -30 || true
              echo; echo "=== ItemStack (use/cooldown) ==="
              javap -cp "$MC" net.minecraft.world.item.ItemStack 2>&1 | grep -iE 'use|count|getMaxDamage|isEmpty|copy' | head -20 || true
              echo; echo "=== EntityAttributeInstance? Attributes ==="
              javap -cp "$MC" net.minecraft.world.entity.ai.attributes.Attributes 2>&1 | grep -iE 'MOVEMENT_SPEED|ATTACK_DAMAGE|ATTACK_SPEED|SNEAKING' | head -10 || true
              echo; echo "=== Hud extractCameraOverlays (байткод) ==="
              javap -p -c -cp "$MC" net.minecraft.client.gui.Hud 2>&1 | sed -n '/private void extractCameraOverlays/,/^$/p' | grep -E 'invoke|getstatic|// ' | sed -n '1,90p'
              echo; echo "=== Hud extractTextureOverlay + camera fields ==="
              javap -p -cp "$MC" net.minecraft.client.gui.Hud 2>&1 | grep -iE 'private net|public net|isInWall|camera' | head -20
              echo; echo "=== Options cameraType/perspective ==="
              javap -p -cp "$MC" net.minecraft.client.Options 2>&1 | grep -iE 'cameraType|Perspective|getSensitivity|textBackgroundOpacity' | head -10
              echo; echo "=== CameraType ==="
              javap -p -cp "$MC" net.minecraft.client.CameraType 2>&1 | head -25
              echo; echo "=== Vec3 (helpers) ==="
              javap -p -cp "$MC" net.minecraft.world.phys.Vec3 2>&1 | grep -iE 'directionFromRotation|rotate|length|normalize|distanceTo|add|scale|lerp' | head -25
              echo; echo "=== GameRenderer (постэффекты) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -iE 'postEffect|Effect|overlay|active' | head -30
              echo; echo "=== Minecraft (постэффекты/камера) ==="
              javap -p -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -iE 'postEffect|EntityRenderDispatcher|getCamera|level;' | head -20
              echo; echo "=== строки-идентификаторы постэффектов в GameRenderer ==="
              javap -v -p -cp "$MC" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -oE 'String [a-z0-9_/:.]+' | grep -iE 'fire|nausea|water|blind|shaders|post' | sort -u | head -20
              echo; echo "=== ассеты шейдеров ==="
              unzip -l "$MC" | grep -iE 'shaders.*(fire|nausea|blind|water)|post/.*(fire|nausea|blind)' | head -20
              echo; echo "=== Hud полный список методов ==="
              javap -p -cp "$MC" net.minecraft.client.gui.Hud 2>&1 | grep -E '^  [a-z]' | head -60
              echo; echo "=== Hud константы-строки ==="
              javap -v -p -cp "$MC" net.minecraft.client.gui.Hud 2>&1 | grep -oE 'String [a-z0-9_/:.]*' | grep -iE 'fire|vignette|snow|pumpkin|portal' | sort -u | head -20
              echo; echo "=== Entity fire ==="
              javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'fire|Fire' | head -20
              echo; echo "=== FlameOverlay/классы ==="
              unzip -l "$MC" | grep -iE 'client/renderer/(Fire|.*Overlay)' | head -20 || true
              echo; echo "=== ScreenEffect / camera overlay компонент ==="
              javap -p -cp "$MC" net.minecraft.world.effect.MobEffect 2>&1 | grep -iE 'screen|overlay|postEffect|attributes' | head -20
              echo; echo "=== DataComponents (список) ==="
              javap -p -cp "$MC" net.minecraft.core.component.DataComponents 2>&1 | grep -iE 'public static final' | head -60
              echo; echo "=== ScreenEffectRenderer ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.ScreenEffectRenderer 2>&1 | head -30
              echo; echo "=== CameraType ==="
              javap -p -cp "$MC" net.minecraft.client.CameraType 2>&1 | head -25
              echo; echo "=== ClientPacketListener (send/playerinfo) ==="
              javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientPacketListener 2>&1 | grep -iE 'send|getPlayerInfo|hasClientLoaded' | head -20 || true
              echo; echo "=== Player (abilities) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'getAbilities|abilities|isCreative|getMainHandItem|getOffhandItem|getArmorValue|absorb|foodData|getFoodData' | head -20
              echo; echo "=== PlayerAbilities ==="
              javap -p -cp "$MC" net.minecraft.world.entity.player.PlayerAbilities 2>&1 | grep -iE 'public' | head -25
              echo; echo "=== LivingEntity (hurt/armor) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'hurtTime|maxHurtTime|getArmorValue|getAbsorptionAmount|invulnerable|getLastDamage|isSleeping|getMainHandItem' | head -20
              echo; echo "=== Entity (level/id/misc) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'public.*(level\(\)|getId\(\)|getUUID|isRemoved|position\(\)|random|setPos|getPos)' | head -20
              echo; echo "=== Options camera type get/set ==="
              javap -p -cp "$MC" net.minecraft.client.Options 2>&1 | grep -iE 'CameraType|setCameraType|toggleCameraType|getSensitivity' | head -10
              echo; echo "=== ItemCooldowns full ==="
              javap -p -cp "$MC" net.minecraft.world.item.ItemCooldowns 2>&1 | head -16
              echo; echo "=== MobEffectInstance ==="
              javap -p -cp "$MC" net.minecraft.world.effect.MobEffectInstance 2>&1 | grep -iE 'public' | head -20 || true
              echo; echo "=== Minecraft (crosshair/misc) ==="
              javap -p -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -iE 'crosshairPickEntity|isPaused|getCameraEntity|setCameraEntity|levelRenderer|isLocalServer|getUser|getWindow|getSoundManager|level;|player;|mouseHandler|options|gameMode|hitResult|fps' | head -30
              echo; echo "=== Entity (velocity/util) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'getDeltaMovement|setDeltaMovement|getPos|position|lastPos|setPos|teleport|merge' | head -20
              echo; echo "=== Entity (rotation full) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'rot|look|Head|Body' | head -40
              echo; echo "=== LivingEntity (fields) ==="
              javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'public (float|double|int|boolean) ' | head -40
              echo; echo "=== ServerboundPlayerInputPacket? ==="
              unzip -l "$MC" | grep -iE 'ServerboundPlayerInputPacket|ServerboundSetCarriedItemPacket|ServerboundPlayerCommandPacket|ServerboundSwingPacket|ServerboundUseItemOnPacket|ServerboundInteractPacket' | head -10
              echo; echo "=== ClientLevel (entities by class) ==="
              javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientLevel 2>&1 | grep -iE 'getEntities|entitiesForRendering|getNonNullEntities|getPlayerByUUID' | head -12
              echo; echo "=== ItemCooldowns full ==="
              javap -p -cp "$MC" net.minecraft.world.item.ItemCooldowns 2>&1 | head -14
              echo; echo "=== GameRenderer (camera/fov) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -iE 'camera|fov|bob|viewOffset|renderItemOverlay|bobHurt|tiltView' | head -30
              echo; echo "=== GameRenderer (post/pipeline API) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -iE 'post|pipeline|shader|Blur|entityEffect|tick' | head -40 || true
              echo; echo "=== классы пост-эффектов ==="
              unzip -l "$MC" | grep -iE 'client/renderer/(post|shader|PostChain|PostEffect|CoreShaders)|RenderPipeline|Pipeline' | awk '{print $NF}' | head -40 || true
              echo; echo "=== CoreShaders ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.CoreShaders 2>&1 | head -40 || true
              echo; echo "=== список assets shaders/post ==="
              unzip -l "$MC" | grep -E 'shaders/post/' | awk '{print $NF}' | head -40 || true
              echo; echo "=== формат pipeline json (nausea) ==="
              unzip -p "$MC" assets/minecraft/shaders/post/nausea.json 2>/dev/null | head -40 || true
              echo; echo "=== формат fshader (nausea) ==="
              unzip -p "$MC" assets/minecraft/shaders/program/nausea.fsh 2>/dev/null | head -30 || true
              echo; echo "=== Particle (базовый класс) ==="
              javap -p -cp "$MC" net.minecraft.client.particle.Particle 2>&1 | grep -iE 'public|protected' | head -45 || true
              echo; echo "=== ClientLevel.addParticle ==="
              javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientLevel 2>&1 | grep -iE 'addParticle|particles' | head -12 || true
              echo; echo "=== ParticleEngine ==="
              javap -p -cp "$MC" net.minecraft.client.particle.ParticleEngine 2>&1 | grep -iE 'public' | head -30 || true
              echo; echo "=== DustParticleOptions ==="
              javap -p -cp "$MC" net.minecraft.core.particles.DustParticleOptions 2>&1 | head -15 || true
              echo; echo "=== GuiGraphicsExtractor (текстуры/спрайты) ==="
              javap -p -cp "$MC" net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | grep -iE 'sampler|texture|blit|sprite|pose|submit' | head -30 || true
              echo; echo "=== Entity render state (для «призраков») ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.entity.state.LivingEntityRenderState 2>&1 | head -40 || true
              echo; echo "=== где лежат pipeline/json (26.2) ==="
              unzip -l "$MC" | grep -F '.json' | grep -iE 'pipeline|post_chain|shader|assets/minecraft/.*post' | awk '{print $NF}' | head -40 || true
              echo; echo "=== все .json рядом с шейдерами ==="
              unzip -l "$MC" | grep -F 'shaders' | grep -F '.json' | awk '{print $NF}' | head -30 || true
              echo; echo "=== PostChainConfig (формат json) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.PostChainConfig 2>&1 | head -30 || true
              echo; echo "=== PostChainConfig inner ==="
              for c in 'net.minecraft.client.renderer.PostChainConfig$Pass' 'net.minecraft.client.renderer.PostChainConfig$InternalTarget' 'net.minecraft.client.renderer.PostChainConfig$Input' 'net.minecraft.client.renderer.PostPass$TextureInput' 'net.minecraft.client.renderer.PostPass$TargetInput' 'net.minecraft.client.renderer.PostPass$Input'; do echo "--- $c"; javap -p -cp "$MC" "$c" 2>&1 | head -14; done
              echo; echo "=== PostChain (публичный API) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.PostChain 2>&1 | head -30 || true
              echo; echo "=== ShaderManager ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.ShaderManager 2>&1 | grep -iE 'public|static' | head -30 || true
              echo; echo "=== GameRenderer полный ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.GameRenderer 2>&1 | head -70 || true
              echo; echo "=== RenderPipeline (blaze3d) ==="
              javap -p -cp "$MC" com.mojang.blaze3d.pipeline.RenderPipeline 2>&1 | head -30 || true
              echo; echo "=== RenderPipelines (ванильные константы) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.RenderPipelines 2>&1 | grep -iE 'BLUR|POST|TRANSPARENCY|GUI|OUTLINE' | head -25 || true
              echo; echo "=== классы entity state ==="
              unzip -l "$MC" | grep -E 'client/renderer/entity/state/' | awk '{print $NF}' | head -30 || true
              echo; echo "=== EntityRenderState ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.entity.state.EntityRenderState 2>&1 | head -30 || true
              echo; echo "=== LivingEntityRenderState (через list) ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.entity.state.LivingEntityRenderState 2>&1 | head -35 || true
              echo; echo "=== ParticleRenderType + SpriteGetter ==="
              javap -p -cp "$MC" net.minecraft.client.particle.ParticleRenderType 2>&1 | head -20 || true
              javap -p -cp "$MC" net.minecraft.client.resources.model.sprite.SpriteGetter 2>&1 | head -15 || true
              echo; echo "=== ParticleOptions/типы (что можно спавнить) ==="
              unzip -l "$MC" | grep -E 'core/particles/[A-Za-z]+ParticleOptions\\.class' | awk '{print $NF}' | head -40 || true
              echo; echo "=== ParticleTypes (константы) ==="
              javap -p -cp "$MC" net.minecraft.core.particles.ParticleTypes 2>&1 | grep -iE 'public static final' | head -60 || true
              echo; echo "=== assets/minecraft: верхнеуровневые папки ==="
              unzip -l "$MC" | awk '{print $NF}' | grep -E '^assets/minecraft/[a-z_]+/' | sed 's#^assets/minecraft/##' | cut -d/ -f1 | sort -u | head -40 || true
              echo; echo "=== json с shader/post/pipeline в имени ==="
              unzip -l "$MC" | awk '{print $NF}' | grep -E 'json$' | grep -iE 'shader|post|pipeline|blur|nausea|transparency|sobel|entity_vision' | head -40 || true
              echo; echo "=== ShaderManager: публичный API ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.ShaderManager 2>&1 | head -40 || true
              echo; echo "=== ShaderManager: строки (папки ресурсов) ==="
              javap -c -p -cp "$MC" net.minecraft.client.renderer.ShaderManager 2>&1 | grep -E 'String' | head -40 || true
              echo; echo "=== GameRenderer: строки ==="
              javap -c -p -cp "$MC" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -E 'String' | head -40 || true
              echo; echo "=== PostChain: строки ==="
              javap -c -p -cp "$MC" net.minecraft.client.renderer.PostChain 2>&1 | grep -E 'String|public' | head -30 || true
              echo; echo "=== UniformValue ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.UniformValue 2>&1 | head -25 || true
              echo; echo "=== shaders/: все файлы ==="
              unzip -l "$MC" | awk '{print $NF}' | grep -E 'shaders/' | head -80 || true
              echo; echo "=== RenderTarget (blaze3d) ==="
              javap -p -cp "$MC" com.mojang.blaze3d.pipeline.RenderTarget 2>&1 | head -30 || true
              echo; echo "=== MainTarget ==="
              javap -p -cp "$MC" com.mojang.blaze3d.pipeline.MainTarget 2>&1 | head -30 || true
              echo; echo "=== Iris/Sodium-пути: RenderPipeline.Snippet ==="
              javap -p -cp "$MC" com.mojang.blaze3d.pipeline.RenderPipeline$Snippet 2>&1 | head -40 || true
              echo; echo "=== RenderPipelines все ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.RenderPipelines 2>&1 | grep -E 'public static final' | head -60 || true
              echo; echo "=== setPostEffect вызовы (checkEntityPostEffect) ==="
              javap -c -p -cp "$MC" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -iE 'postEffect|PostChain|blur' | head -40 || true
              echo; echo "=== список assets/minecraft/post_effect ==="
              unzip -l "$MC" | awk '{print $NF}' | grep -E 'post_effect' | head -20 || true
              echo; echo "=== blur.json (полный пример) ==="
              unzip -p "$MC" assets/minecraft/post_effect/blur.json 2>/dev/null | head -80 || true
              echo; echo "=== invert.json ==="
              unzip -p "$MC" assets/minecraft/post_effect/invert.json 2>/dev/null | head -40 || true
              echo; echo "=== invert.fsh ==="
              unzip -p "$MC" assets/minecraft/shaders/post/invert.fsh 2>/dev/null | head -30 || true
              echo; echo "=== box_blur.fsh ==="
              unzip -p "$MC" assets/minecraft/shaders/post/box_blur.fsh 2>/dev/null | head -40 || true
              echo; echo "=== rotscale.vsh ==="
              unzip -p "$MC" assets/minecraft/shaders/post/rotscale.vsh 2>/dev/null | head -40 || true
              echo; echo "=== RenderTypes: варианты ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.RenderTypes 2>&1 | grep -iE 'emissive|depth|translucent|lines|outline' | head -40 || true
              echo; echo "=== UniformValue + реализации ==="
              unzip -l "$MC" | awk '{print $NF}' | grep -E 'renderer/Uniform|renderer/PostChainConfig' | head -20 || true
              echo; echo "=== ShaderManager public ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.ShaderManager 2>&1 | grep -E 'public' | head -30 || true
              echo; echo "=== GameRenderer setPostEffect/clearPostEffect байткод ==="
              javap -c -p -cp "$MC" net.minecraft.client.renderer.GameRenderer 2>&1 | sed -n '/setPostEffect/,/^$/p' | head -60 || true
              echo; echo "=== FrameGraph/RenderTarget size ==="
              javap -p -cp "$MC" net.minecraft.client.renderer.MainTarget 2>&1 | head -25 || true
            fi

          } > api-audit-result.txt 2>&1
          cat api-audit-result.txt

      - name: Commit result
        if: always()
        run: |
          git config user.name "arena-ai-coding-agent"
          git config user.email "arena-ai-coding-agent@users.noreply.github.com"
          git add api-audit-result.txt || true
          git commit -m "ci: результат аудита API 26.2" || exit 0
          git push

