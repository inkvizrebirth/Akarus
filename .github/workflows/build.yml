name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Show tool versions
        run: java -version

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akarus-build-log
          path: build.log
          if-no-files-found: ignore

      # Миксины должны попасть в jar вместе с refmap-ом, иначе в обфусцированной
      # игре метод startUseItem() просто не найдётся
      - name: Проверить миксины в jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          echo "Проверяю: $JAR"
          unzip -l "$JAR" | grep -E "MinecraftMixin|akarus.mixins.json|akarus-refmap.json"
          unzip -l "$JAR" | grep -q "akarus-refmap.json" || { echo "::error::refmap миксинов не попал в jar"; exit 1; }
          unzip -l "$JAR" | grep -q "com/akarus/client/mixin/MinecraftMixin.class" || { echo "::error::класс миксина не попал в jar"; exit 1; }

      - name: Collect jars
        run: |
          mkdir -p out
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} out/ \;
          ls -la out

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: akarus
          path: out/*.jar
          if-no-files-found: error
