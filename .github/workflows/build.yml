name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Show tool versions
        run: java -version

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Verify mixins and refmap are inside the jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          echo "Проверяем jar: $JAR"
          echo "--- классы миксинов ---"
          unzip -l "$JAR" | grep -E 'com/akarus/client/mixin/.*\.class' || { echo "НЕТ классов миксинов!"; exit 1; }
          echo "--- refmap ---"
          unzip -l "$JAR" | grep -E '\.refmap\.json' || { echo "НЕТ refmap!"; exit 1; }
          echo "--- refmap в конфиге миксинов ---"
          unzip -p "$JAR" akarus.mixins.json
          unzip -p "$JAR" akarus.mixins.json | grep -o '"refmap"[^,]*' || { echo "Конфиг миксинов не ссылается на refmap!"; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akarus-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Collect jars
        run: |
          mkdir -p out
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} out/ \;
          ls -la out

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: akarus
          path: out/*.jar
          if-no-files-found: error
