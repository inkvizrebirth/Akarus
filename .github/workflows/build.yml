name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Show tool versions
        run: java -version

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akarus-build-log
          path: build.log
          if-no-files-found: ignore

      # Диагностика: что реально лежит внутри jar (миксины и refmap)
      - name: Показать содержимое jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          echo "JAR=$JAR"
          echo "::notice::ALL=$(unzip -l "$JAR" | awk '{print $4}' | grep -v '^$' | tr '\n' ' ')"
          echo "::notice::MIXINSJSON=$(unzip -p "$JAR" akarus.mixins.json 2>/dev/null | tr -d '\n')"
          echo "::notice::MODJSON=$(unzip -p "$JAR" fabric.mod.json 2>/dev/null | tr -d '\n')"
          unzip -l "$JAR" | grep -iE "refmap|mixin"

      - name: Collect jars
        run: |
          mkdir -p out
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} out/ \;
          ls -la out

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: akarus
          path: out/*.jar
          if-no-files-found: error
