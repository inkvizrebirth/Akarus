name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Show tool versions
        run: java -version

      - name: Fetch embedded mods for bundling
        run: |
          mkdir -p libs
          # Свежие релизные jar под Minecraft 26.2 из GitHub releases; при проблемах с API —
          # запасной путь к известному тегу. Сборка требует полный набор: fabric.mod.json
          # объявляет все пять nested jar.
          fetch() { # repo tag pattern out
            local url
            url=$(curl -fsSL --max-time 20 "https://api.github.com/repos/$1/releases/tags/$2" \
              | grep -oE 'https://github.com/[^"]+/releases/download/[^"]+\.jar' \
              | grep -E "$3" | grep -vE 'sources|javadoc|dev' | head -1 || true)
            if [ -z "$url" ]; then
              echo "::error::$4 ($1@$2) не найден"; exit 1
            fi
            echo "Скачиваю: $url"
            curl -fL --retry 3 --max-time 180 -o "libs/$4" "$url"
          }
          fetch ViaVersion/ViaFabricPlus 4.6.3 'ViaFabricPlus-[0-9.]+' ViaFabricPlus.jar
          # Sodium не выкладывает jar в GitHub-релизы — берём с Modrinth (fabric, 26.2)
          sodium_url=$(curl -fsSL --max-time 20 \
            'https://api.modrinth.com/v2/project/sodium/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.2%22%5D' \
            | grep -oE 'https://cdn\.modrinth\.com/[^"]+\.jar' | head -1 || true)
          if [ -z "$sodium_url" ]; then
            echo "::error::Sodium (fabric, mc26.2) не найден на Modrinth"; exit 1
          fi
          echo "Скачиваю: $sodium_url"
          curl -fL --retry 3 --max-time 180 -o libs/Sodium.jar "$sodium_url"
          fetch CaffeineMC/lithium mc26.2-0.25.3 'lithium.*fabric.*26\.2' Lithium.jar
          fetch Prospector/modmenu v20.0.1 'modmenu-20\.0\.1' ModMenu.jar
          fetch RaphiMC/ImmediatelyFast v1.16.4 'ImmediatelyFast-Fabric-1\.16\.4.*26\.2' ImmediatelyFast.jar
          ls -la libs/
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            # Превращаем ошибки компиляции в annotations, чтобы их можно было
            # прочитать через API check-runs (логи артефактом из песочницы не качаются)
            python3 tools/ci_errors.py || true
            # А если это ошибка Gradle/Loom — выкладываем секцию «What went wrong»
            awk '/What went wrong/{flag=1} flag' build.log | head -50 \
              | while IFS= read -r line; do [ -n "$line" ] && echo "::error::${line}"; done || true
            echo "::error::Сборка завершилась с ошибкой (код $status)"
          fi
          exit "$status"

      - name: Verify mixins are remapped inside the jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          echo "Проверяем jar: $JAR"
          echo "--- классы миксинов ---"
          unzip -l "$JAR" | grep -E 'com/dreamcast/client/mixin/.*\.class' || { echo "::error::НЕТ классов миксинов!"; exit 1; }
          echo "--- конфиг миксинов ---"
          unzip -p "$JAR" dreamcast.mixins.json || { echo "::error::НЕТ dreamcast.mixins.json!"; exit 1; }
          echo "--- refmap (информационно: в Loom 1.17 его нет, имена переписаны в байткод) ---"
          unzip -l "$JAR" | grep -E '\.refmap\.json' || echo "refmap отсутствует — это норма для Loom 1.17"
          echo "--- ссылка на конфиг миксинов в fabric.mod.json ---"
          unzip -p "$JAR" fabric.mod.json | grep -q 'dreamcast\.mixins\.json' || { echo "::error::fabric.mod.json не объявляет mixins!"; exit 1; }
          echo "OK: fabric.mod.json ссылается на dreamcast.mixins.json"
          echo "--- nested jars (ViaFabricPlus) ---"
          unzip -l "$JAR" | grep -E 'META-INF/jars/.*\.jar' || echo "::warning::VFP не вшита (libs/ViaFabricPlus.jar отсутствовал на сборке)"; true
          echo "--- refmap / intermediary (информационно) ---"
          # В Minecraft 26.2 нет intermediary-маппингов (26.2.tiny отсутствует в
          # FabricMC/intermediary), а runtime использует официальные имена Mojang,
          # поэтому ни refmap, ни method_/class_ в jar быть не должно — это норма.
          unzip -l "$JAR" | grep -E '\.refmap\.json' && echo "refmap найден" || echo "refmap отсутствует (норма для 26.2)"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Report compile errors as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) {}
            const lines = log.split('\n');
            const out = [];
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].includes('error:')) {
                out.push(lines.slice(i, i + 6).join('\n'));
              }
            }
            const body = (out.join('\n---\n') || 'см. артефакт dreamcast-build-log').slice(0, 60000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI: ошибки компиляции (' + context.sha.slice(0, 7) + ')',
              labels: ['ci-errors'],
              body
            });

      - name: Collect jars
        run: |
          mkdir -p out
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} out/ \;
          ls -la out

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast
          path: out/*.jar
          if-no-files-found: error
