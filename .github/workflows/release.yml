name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v0.1.1'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache embedded mods
        uses: actions/cache@v4
        with:
          path: libs
          key: dreamcast-embedded-mods-v1-vfp4.6.3-lithium0.25.3-modmenu20.0.1-imf1.16.4
      - name: Fetch embedded mods for bundling
        run: |
          mkdir -p libs
          # Вложенные моды качаются с GitHub/Modrinth, а их API периодически
          # отваливаются — и сборка падала не на компиляции. Поэтому: кэш между
          # сборками, повторы запросов и проверка, что прилетел настоящий zip,
          # а не страница ошибки.
          rm -f libs/Sodium.jar   # Sodium не пинимся версией — всегда берём свежий
          check_zip() { # file name
            if [ ! -s "$1" ] || [ "$(head -c 2 "$1" | tr -dc 'A-Za-z')" != "PK" ]; then
              echo "::error::$2 — скачался не jar (ожидалась zip-подпись PK)"; exit 1
            fi
          }
          fetch() { # repo tag pattern out
            local url="" attempt
            if [ -s "libs/$4" ]; then echo "уже в кэше: $4"; check_zip "libs/$4" "$4"; return 0; fi
            for attempt in 1 2 3; do
              url=$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 3 --max-time 45 \
                "https://api.github.com/repos/$1/releases/tags/$2" \
                | grep -oE 'https://github.com/[^"]+/releases/download/[^"]+\.jar' \
                | grep -E "$3" | grep -vE 'sources|javadoc|dev' | head -1 || true)
              [ -n "$url" ] && break
              echo "попытка $attempt: $1@$2 не отвечает, повторяю"; sleep 5
            done
            if [ -z "$url" ]; then
              echo "::error::$4 ($1@$2) не найден"; exit 1
            fi
            echo "Скачиваю: $url"
            curl -fL --retry 4 --retry-all-errors --retry-delay 4 --max-time 240 -o "libs/$4" "$url"
            check_zip "libs/$4" "$4"
          }
          fetch ViaVersion/ViaFabricPlus 4.6.3 'ViaFabricPlus-[0-9.]+' ViaFabricPlus.jar
          # Sodium не выкладывает jar в GitHub-релизы — берём с Modrinth (fabric, 26.2)
          sodium_url=""
          for attempt in 1 2 3; do
            sodium_url=$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 3 --max-time 45 \
              'https://api.modrinth.com/v2/project/sodium/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.2%22%5D' \
              | grep -oE 'https://cdn\.modrinth\.com/[^"]+\.jar' | head -1 || true)
            [ -n "$sodium_url" ] && break
            echo "попытка $attempt: Modrinth не отвечает, повторяю"; sleep 5
          done
          if [ -z "$sodium_url" ]; then
            echo "::error::Sodium (fabric, mc26.2) не найден на Modrinth"; exit 1
          fi
          echo "Скачиваю: $sodium_url"
          curl -fL --retry 4 --retry-all-errors --retry-delay 4 --max-time 240 -o libs/Sodium.jar "$sodium_url"
          check_zip libs/Sodium.jar Sodium.jar
          fetch CaffeineMC/lithium mc26.2-0.25.3 'lithium.*fabric.*26\.2' Lithium.jar
          fetch Prospector/modmenu v20.0.1 'modmenu-20\.0\.1' ModMenu.jar
          fetch RaphiMC/ImmediatelyFast v1.16.4 'ImmediatelyFast-Fabric-1\.16\.4.*26\.2' ImmediatelyFast.jar
          ls -la libs/
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Verify nested jars
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          unzip -l "$JAR" | grep -E 'META-INF/jars/.*\.jar' \
            || echo "::warning::VFP не вшита в релизный jar"; true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamcast-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Report compile errors as issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) {}
            const lines = log.split('\n');
            const out = [];
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].includes('error:')) {
                out.push(lines.slice(i, i + 6).join('\n'));
              }
            }
            const body = (out.join('\n---\n') || 'см. артефакт dreamcast-build-log').slice(0, 60000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI: ошибки компиляции (' + context.sha.slice(0, 7) + ')',
              labels: ['ci-errors'],
              body
            });

      - name: Collect jars
        run: |
          mkdir -p out
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} out/ \;
          ls -la out

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dreamcast ${{ steps.version.outputs.tag }}
          body: |
            ## Dreamcast ${{ steps.version.outputs.tag }} — Minecraft 26.2 · Fabric (Java 25)

            - Встроенные ViaFabricPlus, Sodium, Lithium, ImmediatelyFast и Mod Menu.
            - Главное меню и ClickGUI: плавные анимации, фон, корректная прокрутка
              и компактные списки.
            - Макросы без искусственного лимита: каждой команде можно назначить
              собственную клавишу.
            - KillAura, Scaffold, AutoBuff, HUD, медиаплеер и другие модули.

            Установка: jar в `mods` + [Fabric Loader](https://fabricmc.net/use/installer/) 0.19.3
            для 26.2 + [Fabric API](https://modrinth.com/mod/fabric-api).

            Вопросы и баги: [Telegram @inkviz01](https://t.me/inkviz01).
          files: out/*.jar
          draft: false
          prerelease: false
