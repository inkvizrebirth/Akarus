name: api-audit2

# Расширенный аудит API Minecraft 26.2 под новые фичи (AutoTotem, GUI, Via-кнопка, медиаплеер).
# Результат: 1) коммитится файлом api-audit2-result.txt в текущую ветку,
#            2) каждая строка — отдельная check-run annotation (читается через API).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Resolve Minecraft
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava --stacktrace > build.log 2>&1 || true
          tail -15 build.log

      - name: Inspect API
        run: |
          MC=$(find ~/.gradle/caches/fabric-loom -name '*deobf*.jar' 2>/dev/null | head -1)
          echo "MC_JAR=$MC"
          {
            echo "=== Screen (public/protected) ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.Screen 2>&1 | head -120
            echo; echo "=== TitleScreen ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.TitleScreen 2>&1 | head -60
            echo; echo "=== GuiGraphicsExtractor (публичные методы рисования) ==="
            javap -cp "$MC" net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | head -160
            echo; echo "=== Button / AbstractWidget / Tooltip'ы ==="
            javap -p -cp "$MC" net.minecraft.client.gui.components.Button 2>&1 | head -50
            javap -p -cp "$MC" net.minecraft.client.gui.components.AbstractWidget 2>&1 | head -60
            javap -p -cp "$MC" net.minecraft.client.gui.components.Tooltip 2>&1 | head -20
            echo; echo "=== Options (все поля-клавиши и методы get/set) ==="
            javap -p -cp "$MC" net.minecraft.client.Options 2>&1 | head -260
            echo; echo "=== Options screen / PauseScreen / GameMenuScreen ==="
            javap -p -cp "$MC" net.minecraft.client.gui.screens.Options 2>&1 | head -30
            javap -p -cp "$MC" net.minecraft.client.gui.screens.PauseScreen 2>&1 | head -40 || true
            javap -p -cp "$MC" net.minecraft.client.gui.screens.GameMenuScreen 2>&1 | head -40 || true
            echo; echo "=== MultiplayerGameConfig / ServerSelection ==="
            unzip -l "$MC" | grep -iE 'serverselection|serverlist|MultiplayerGameConfig|SelectServer|JoinMultiplayer|LanServer' | head -30
            echo; echo "=== Minecraft (поля/методы по GUI) ==="
            javap -p -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -iE 'screen|title|pause|stop|getSoundManager|getLanguageManager|version|brand|resize|setScreen|gui|options|user' | head -40
            echo; echo "=== ClientPacketListener / SharedConstants / ClientBrandRetriever ==="
            javap -p -cp "$MC" net.minecraft.SharedConstants 2>&1 | head -40
            unzip -l "$MC" | grep -iE 'BrandRetriever|SharedConstants' | head -5
            javap -p -cp "$MC" net.minecraft.ClientBrandRetriever 2>&1 | head -15
            echo; echo "=== MultiPlayerGameMode (клики/использование) ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | head -70
            echo; echo "=== ContainerInput (константы) ==="
            javap -p -cp "$MC" net.minecraft.world.inventory.ContainerInput 2>&1 | head -40
            echo; echo "=== AbstractContainerMenu (clickMenuButton) ==="
            javap -p -cp "$MC" net.minecraft.world.inventory.AbstractContainerMenu 2>&1 | grep -iE 'click|broadcastCarried|getSlot|containerId|slots' | head -20
            javap -p -cp "$MC" net.minecraft.world.inventory.InventoryMenu 2>&1 | grep -iE 'clickMenuButton|SLOT|static' | head -10
            echo; echo "=== Inventory (оффхенд и прочее) ==="
            javap -p -cp "$MC" net.minecraft.world.entity.player.Inventory 2>&1 | head -80
            echo; echo "=== Player (руки/еда/своп) ==="
            javap -p -cp "$MC" net.minecraft.world.entity.player.Player 2>&1 | grep -iE 'hand|using|use|inventor|block|swap|health|ability|eat|food|cooldown|experience' | head -50
            echo; echo "=== LivingEntity (hp/свинг/падение) ==="
            javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'health|swing|blocking|using|fall|hurt|jump|effect|potion|attack|equipment|weapon|absorption|shield' | head -60
            echo; echo "=== Entity (движение/позиция) ==="
            javap -p -cp "$MC" net.minecraft.world.entity.Entity 2>&1 | grep -iE 'deltaMovement|position|rot|onGround|fire|tick|id\(|uuid|age|vehicle|passenger|type\(|dimension' | head -40
            echo; echo "=== Мобы/снаряды ==="
            unzip -l "$MC" | grep -iE 'entity/(mob|player)/|projectile' | grep -iE 'Mob|Monster|Player|Projectile|AbstractArrow|Throwable|Trident|WindCharge' | head -40
            javap -p -cp "$MC" net.minecraft.world.entity.projectile.Projectile 2>&1 | head -30
            javap -p -cp "$MC" net.minecraft.world.entity.projectile.AbstractArrow 2>&1 | grep -iE 'pickup|shooter|critical|inGround|velocity|life' | head -15
            echo; echo "=== Items (тотем/еда/оружие) ==="
            javap -p -cp "$MC" net.minecraft.world.item.Items 2>&1 | grep -iE 'TOTEM|APPLE|GOLDEN|SHIELD|SWORD|AXE|MACE|TRIDENT|BUCKET|CARROT|BREAD|PEARL|BOW|CROSSBOW' | head -40
            echo; echo "=== ItemStack ==="
            javap -p -cp "$MC" net.minecraft.world.item.ItemStack 2>&1 | grep -iE 'isEmpty|getItem|getCount|is\(|copy' | head -15
            echo; echo "=== Item (useInterval/едовые методы) ==="
            javap -p -cp "$MC" net.minecraft.world.item.Item 2>&1 | grep -iE 'use|finishUsing|getUseDuration|eat|consume' | head -15
            javap -p -cp "$MC" net.minecraft.world.item.component.Consumable 2>&1 | head -20 || true
            echo; echo "=== ItemCooldowns ==="
            javap -p -cp "$MC" net.minecraft.world.item.ItemCooldowns 2>&1 | head -15
            echo; echo "=== ClientLevel (поиск сущностей) ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientLevel 2>&1 | grep -iE 'entit|player|getEntity' | head -25
            echo; echo "=== AABB ==="
            javap -p -cp "$MC" net.minecraft.world.phys.AABB 2>&1 | grep -iE 'public static|intersects|inflate|contains|clip|move|min|max' | head -30
            echo; echo "=== Vec3 ==="
            javap -p -cp "$MC" net.minecraft.world.phys.Vec3 2>&1 | grep -iE 'public|distance|normalize|add|scale|lerp|dot|cross' | head -40
            echo; echo "=== Mace / WindCharge / damage ==="
            unzip -l "$MC" | grep -iE 'mace|windcharge|wind_charge' | head -10
            javap -p -cp "$MC" net.minecraft.world.damagesource.DamageSources 2>&1 | head -60
            echo; echo "=== Util / OperatingSystem (открыть папку) ==="
            javap -p -cp "$MC" net.minecraft.util.Util 2>&1 | head -30
            javap -p -cp "$MC" net.minecraft.Util 2>&1 | head -5 || true
            unzip -l "$MC" | grep -iE 'OperatingSystem|platform' | head -8
            javap -p -cp "$MC" net.minecraft.util.OperatingSystem 2>&1 | head -30
            echo; echo "=== SoundManager / SoundEvent / SimpleSoundInstance ==="
            javap -p -cp "$MC" net.minecraft.client.sounds.SoundManager 2>&1 | head -30
            javap -p -cp "$MC" net.minecraft.client.resources.sounds.SimpleSoundInstance 2>&1 | head -25
            echo; echo "=== Font / GuiGraphics текст ==="
            javap -cp "$MC" net.minecraft.client.gui.Font 2>&1 | grep -iE 'width|lineHeight|drawString|shadow|extract' | head -20
            echo; echo "=== Hud (26.2) — публичные поля/методы ==="
            javap -p -cp "$MC" net.minecraft.client.gui.Gui 2>&1 | head -40
            javap -p -cp "$MC" net.minecraft.client.gui.Hud 2>&1 | head -60
            echo; echo "=== GuiManager: screen() / setScreen() ==="
            unzip -l "$MC" | grep -iE 'client/Gui[a-zA-Z]*\.class' | head -15
            javap -p -cp "$MC" net.minecraft.client.GuiManager 2>&1 | head -25
            echo; echo "=== EffectInstance / Shader for screens? (dirt background) ==="
            javap -p -cp "$MC" net.minecraft.client.gui.GuiGraphicsExtractor 2>&1 | grep -iE 'texture|blit|sprite|submit|extract' | head -60
            echo; echo "=== RenderPipelines (доступные пайплайны) ==="
            javap -p -cp "$MC" net.minecraft.client.renderer.RenderPipelines 2>&1 | grep -iE 'GUI|TEXT|POSITION' | head -30
            echo; echo "=== MobEffects ==="
            javap -p -cp "$MC" net.minecraft.world.effect.MobEffects 2>&1 | grep -iE 'STRENGTH|SPEED|REGEN|WEAKNESS|RESISTANCE|POISON|WITHER|BLIND|NAUSEA|DARK' | head -12
            echo; echo "=== Mob / Mob category / Enemy ==="
            javap -p -cp "$MC" net.minecraft.world.entity.Mob 2>&1 | grep -iE 'target|level|attack' | head -12
            echo; echo "=== EquipmentSlot / EquipmentUser ==="
            javap -p -cp "$MC" net.minecraft.world.entity.EquipmentSlot 2>&1 | head -20
            javap -p -cp "$MC" net.minecraft.world.entity.EquipmentUser 2>&1 | head -25
            echo; echo "=== Living accessor: getItemBySlot? ==="
            javap -p -cp "$MC" net.minecraft.world.entity.LivingEntity 2>&1 | grep -iE 'getItem|itemInHand|held|equip' | head -15
            echo; echo "=== Attribute / damage value of weapon ==="
            javap -p -cp "$MC" net.minecraft.world.item.SwordItem 2>&1 | head -15 || true
            javap -p -cp "$MC" net.minecraft.world.item.TieredItem 2>&1 | head -15 || true
            javap -p -cp "$MC" net.minecraft.world.entity.ai.attributes.Attributes 2>&1 | grep -iE 'ATTACK|ARMOR|MOVEMENT' | head -10
            echo; echo "=== AttributeInstance ==="
            javap -p -cp "$MC" net.minecraft.world.entity.ai.attributes.AttributeInstance 2>&1 | grep -iE 'getValue' | head -6
            echo; echo "=== Enchantment / enchantment value helper ==="
            javap -p -cp "$MC" net.minecraft.world.item.enchantment.Enchantments 2>&1 | grep -iE 'SHARPNESS|POWER|IMPALING' | head -8
            javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientLevel 2>&1 | grep -iE 'registry|registryAccess' | head -6
            echo; echo "=== ItemAttributeModifiers (damage) ==="
            javap -p -cp "$MC" net.minecraft.world.item.ItemAttributeModifiers 2>&1 | head -25 || true
            echo; echo "=== ItemBase getDamage? WeaponStats ==="
            javap -p -cp "$MC" net.minecraft.world.item.component.ItemAttributeModifiers 2>&1 | head -25 || true
            echo; echo "=== fabric mod menu / entrypoints? (fabric-loader KeyMapping.Category) ==="
            javap -p -cp "$MC" net.minecraft.client.KeyMapping 2>&1 | grep -iE 'Category|setKey|resetMapping|consumeClick|activate' | head -20
            echo; echo "=== Input (KeyboardInput keyPresses) ==="
            javap -p -cp "$MC" net.minecraft.world.entity.player.Input 2>&1 | head -25
            echo; echo "=== PlayerInfo latency ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.PlayerInfo 2>&1 | grep -iE 'latency|ping' | head -6
            echo; echo "=== ClientPacketListener methods ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientPacketListener 2>&1 | grep -iE 'send|playerInfo|getLatency|getConnection' | head -20
            echo; echo "=== Level difficulty / game rules ==="
            javap -p -cp "$MC" net.minecraft.client.multiplayer.ClientPacketListener 2>&1 | grep -iE 'localDiff|serverData|OnlineOptions' | head -8
            echo; echo "=== ServerData fields (для кнопки версии) ==="
            unzip -l "$MC" | grep -iE 'ClientHandshakePacketListenerImpl|Handshake' | head -6
            echo; echo "=== DeltaTracker ==="
            javap -p -cp "$MC" net.minecraft.client.DeltaTracker 2>&1 | head -18
            echo; echo "=== ScreenEvents fabric (screen API) ==="
            find ~/.gradle/caches/modules-2 -name 'fabric-screen-api-v1*.jar' | head -3
          } > api-audit2-result.txt 2>&1
          wc -l api-audit2-result.txt
          head -80 api-audit2-result.txt

      - name: Push results
        if: always()
        run: |
          git config user.name "arena-ai-coding-agent"
          git config user.email "arena-ai-coding-agent@users.noreply.github.com"
          git add api-audit2-result.txt
          git commit -m "ci: аудит API 26.2 (GUI/AutoTotem/Via/медиа)" || exit 0
          git pull --rebase || git pull --strategy=ort -X theirs || true
          git push origin "HEAD:${{ github.ref_name }}" || true

      - name: Annotate (первые строки — на случай, если push не прошёл)
        if: always()
        run: |
          head -40 api-audit2-result.txt | while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice::${line}"
          done || true
